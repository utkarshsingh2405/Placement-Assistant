# Render Blueprint Specification for Placement Assistant Unified Platform
# Docs: https://render.com/docs/blueprint-spec

services:
  # ============================================================================
  # Unified Single-JVM Platform: Portal + Institute + Placement in One Container
  # ============================================================================
  - type: web
    name: placement-assistant
    runtime: docker
    dockerContext: .
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "8080"
      - key: SPRING_PROFILES_ACTIVE
        value: sqlite
      - key: DB_PATH
        value: /app/database/placement_assist.db
      - key: JWT_SECRET
        sync: false
      - key: INSTITUTE_API_KEY
        sync: false
      - key: MAIL_MODE
        value: log
