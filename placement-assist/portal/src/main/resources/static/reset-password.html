<!DOCTYPE html>
<html lang="en" data-theme="light" data-domain="portal">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - PlacementAssist Unified Portal</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Styles -->
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/components.css">
    
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--background);
            padding: 2rem 1rem;
        }
        .auth-card {
            width: 100%;
            max-width: 440px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-lg);
            padding: 2.25rem;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="text-center mb-4">
            <a href="/" class="d-inline-flex align-items-center gap-2 text-decoration-none text-dark">
                <span class="fs-2">🎓</span>
                <span class="fw-bold fs-3 font-heading text-dark">Placement<span class="text-primary">Assist</span></span>
            </a>
            <h5 class="fw-bold font-heading mt-2 mb-1">Set New Password</h5>
            <p class="text-muted small mb-0">Choose a secure new password for your account</p>
        </div>

        <div id="alert-container"></div>

        <form id="reset-form">
            <input type="hidden" id="token">

            <div class="mb-3">
                <label for="newPassword" class="form-label fw-semibold small">New Password (Min. 6 chars)</label>
                <div class="input-group">
                    <span class="input-group-text bg-surface-2 border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control border-start-0" id="newPassword" required minlength="6" placeholder="••••••••">
                </div>
            </div>

            <div class="mb-3">
                <label for="confirmPassword" class="form-label fw-semibold small">Confirm New Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-surface-2 border-end-0 text-muted"><i class="bi bi-shield-lock"></i></span>
                    <input type="password" class="form-control border-start-0" id="confirmPassword" required minlength="6" placeholder="••••••••">
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm" id="submit-btn">
                <span>Update Password</span>
                <span id="btn-spinner" class="spinner-border spinner-border-sm d-none ms-2" role="status"></span>
            </button>
        </form>

        <div class="text-center mt-4 small">
            <a href="/login.html" class="fw-semibold text-primary text-decoration-none">Return to Sign In</a>
        </div>
    </div>

    <script type="module">
        import api from '/js/api.js';

        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        const alertBox = document.getElementById('alert-container');
        const form = document.getElementById('reset-form');

        if (!token) {
            alertBox.innerHTML = `
                <div class="alert alert-danger py-2 px-3 small mb-3">
                    Invalid or missing password reset token. Please request a new one from the forgot password page.
                </div>
            `;
            document.getElementById('submit-btn').disabled = true;
        } else {
            document.getElementById('token').value = token;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            alertBox.innerHTML = '';

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword !== confirmPassword) {
                alertBox.innerHTML = `
                    <div class="alert alert-danger py-2 px-3 small mb-3">
                        Passwords do not match. Please re-enter.
                    </div>
                `;
                return;
            }

            const submitBtn = document.getElementById('submit-btn');
            const btnSpinner = document.getElementById('btn-spinner');
            submitBtn.disabled = true;
            btnSpinner.classList.remove('d-none');

            try {
                await api.post('/api/auth/reset-password', {
                    token: token,
                    newPassword: newPassword
                });
                alertBox.innerHTML = `
                    <div class="alert alert-success py-2 px-3 small mb-3">
                        Password updated successfully! Redirecting to login in 2 seconds...
                    </div>
                `;
                setTimeout(() => {
                    window.location.href = '/login.html';
                }, 2000);
            } catch (err) {
                alertBox.innerHTML = `
                    <div class="alert alert-danger py-2 px-3 small mb-3">
                        ${err.message || 'Failed to reset password. The link may have expired.'}
                    </div>
                `;
                submitBtn.disabled = false;
                btnSpinner.classList.add('d-none');
            }
        });
    </script>
</body>
</html>
