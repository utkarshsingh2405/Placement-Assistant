server:
  port: ${PORTAL_PORT:8080}

spring:
  application:
    name: portal-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:sqlite:${DB_PATH:./data/portal.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-init-sql: "PRAGMA foreign_keys = ON; PRAGMA journal_mode = WAL;"

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Access-Control-Allow-Methods Access-Control-Allow-Headers, RETAIN_FIRST
      httpclient:
        connect-timeout: 2000
        response-timeout: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# JWT configuration shared across Portal and Pillars
jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days

# Inter-Pillar Routing & Integration
pillar:
  institute:
    url: ${INSTITUTE_URL:http://localhost:8081}
    api-key: ${INSTITUTE_API_KEY:inst-sec-key-7f9a12b4e8c345d6}
  placement:
    url: ${PLACEMENT_URL:http://localhost:8082}

mail:
  mode: ${MAIL_MODE:log}
