<!DOCTYPE html>
<html lang="en" data-domain="placement">
<head>
  <script>
    (function(){try{var s=localStorage.getItem('pa_theme_preference')||sessionStorage.getItem('pa_theme_preference');if(!s){var m=document.cookie.match(/(?:^|; )pa_theme_preference=(dark|light)/);if(m)s=m[1];}if(!s&&window.name&&window.name.indexOf('pa_theme:')!==-1){var p=window.name.split('pa_theme:')[1];if(p)s=p.split(' ')[0];}var t=(s==='dark')?'dark':'light';document.documentElement.setAttribute('data-theme',t);document.documentElement.style.colorScheme=t;}catch(e){}})();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications &amp; Alerts - Placement Assistance</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/placement/css/theme.css" rel="stylesheet">
  <link href="/placement/css/components.css" rel="stylesheet">
  <link href="/placement/css/domain-switcher.css" rel="stylesheet">
  <style>
    .notif-item {
      border: 1px solid var(--border-color, #e2e8f0);
      border-radius: 10px;
      padding: 1.25rem;
      background: var(--surface, #ffffff);
      margin-bottom: 0.75rem;
      transition: all 0.2s ease;
      display: flex;
      align-items: flex-start;
      gap: 1rem;
    }
    .notif-item.unread {
      background: #f0fdfa;
      border-color: #99f6e4;
    }
    .notif-icon-circle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #f0fdfa;
      color: #0d9488;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 1.1rem;
    }
    .notif-item.unread .notif-icon-circle {
      background: #0d9488;
      color: #ffffff;
    }
  </style>
</head>
<body class="bg-surface">

  <div class="app-container">
    <div id="sidebar-container"></div>

    <div class="main-wrapper">
      <div id="topbar-container"></div>

      <main class="page-content py-4 px-3 px-md-4">
        <div class="container-fluid max-w-900">

          <!-- Header -->
          <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3 mb-4">
            <div>
              <div class="d-flex align-items-center gap-2">
                <span class="badge text-uppercase" style="background-color: #0d9488; color: white;">Alert Center</span>
                <span class="text-muted small">Real-time Push &amp; In-App</span>
              </div>
              <h2 class="fw-bold mt-1 mb-0">Notifications &amp; Activity</h2>
              <p class="text-muted small mb-0">Drive registrations, interview call letters, stage advancements, and urgent notices.</p>
            </div>
            <button class="btn btn-outline-secondary btn-sm" id="mark-all-read-btn">
              Mark All as Read
            </button>
          </div>

          <!-- Notification Items List -->
          <div id="notifications-list-container">
            <div class="text-center py-5 text-muted">
              <div class="spinner-border text-teal mb-3" role="status" style="color: #0d9488;"></div>
              <div>Fetching notifications...</div>
            </div>
          </div>

        </div>
      </main>
    </div>
  </div>

  <script type="module">
    import auth from '/placement/js/auth.js';
    import ui from '/placement/js/ui.js';
    import api from '/placement/js/api.js';

    if (!auth.requireAuth()) {}

    ui.initLayout('notifications');

    async function loadNotifications() {
      const container = document.getElementById('notifications-list-container');
      try {
        const res = await api.get('/notifications');
        const notifs = res?.data || [];
        renderNotifications(notifs);
      } catch (err) {
        container.innerHTML = `<div class="text-center py-4 text-danger">Failed to load notifications.</div>`;
      }
    }

    function renderNotifications(notifs) {
      const container = document.getElementById('notifications-list-container');
      if (notifs.length === 0) {
        container.innerHTML = `
          <div class="card p-5 text-center text-muted border-0 shadow-sm">
            <div class="fs-2 mb-2">🔔</div>
            <h5>No notifications right now</h5>
            <p class="small mb-0">You're completely caught up! New updates will appear here in real-time.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = notifs.map(n => {
        const isUnread = !n.read;
        const time = n.createdAt ? new Date(n.createdAt).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) : 'Recently';

        let icon = '📢';
        if (n.category === 'STAGE_UPDATE' || n.category === 'SHORTLIST') icon = '⚡';
        if (n.category === 'RESULT' || n.category === 'SELECTION') icon = '🏆';
        if (n.category === 'INTERVIEW') icon = '📅';

        return `
          <div class="notif-item ${isUnread ? 'unread' : ''} shadow-sm" data-id="${n.id}">
            <div class="notif-icon-circle">${icon}</div>
            <div class="flex-grow-1">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <span class="badge bg-surface-2 text-dark border small">${ui.escapeHtml(n.category || 'ANNOUNCEMENT')}</span>
                <span class="text-muted" style="font-size: 0.72rem;">${ui.escapeHtml(time)}</span>
              </div>
              <h6 class="fw-bold mb-1 text-dark">${ui.escapeHtml(n.title || 'Recruitment Notice')}</h6>
              <p class="text-muted small mb-0">${ui.escapeHtml(n.message || '')}</p>
            </div>
            ${isUnread ? `
              <button class="btn btn-sm btn-outline-primary btn-mark-read text-nowrap" style="font-size: 0.75rem;" data-id="${n.id}">
                Mark Read
              </button>
            ` : ''}
          </div>
        `;
      }).join('');

      container.querySelectorAll('.btn-mark-read').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const id = btn.getAttribute('data-id');
          try {
            await api.put(`/notifications/${id}/read`);
            loadNotifications();
          } catch (err) {
            console.error(err);
          }
        });
      });
    }

    document.getElementById('mark-all-read-btn')?.addEventListener('click', async () => {
      try {
        await api.put('/notifications/read-all');
        ui.showToast('All notifications marked as read', 'success');
        loadNotifications();
      } catch (err) {
        ui.showToast('Failed to mark all as read', 'danger');
      }
    });

    loadNotifications();
  </script>
</body>
</html>
