# Render Blueprint Specification for Placement Assistant
# Docs: https://render.com/docs/blueprint-spec

services:
  # ============================================================================
  # 1. Institute Pillar (Port 8081, Context /institute)
  # ============================================================================
  - type: web
    name: placement-assist-institute
    runtime: docker
    dockerContext: .
    dockerfilePath: ./institute/Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /institute/actuator/health
    envVars:
      - key: SERVER_PORT
        value: 8081
      - key: PORTAL_PORT
        value: 8081
      - key: CONTEXT_PATH
        value: /institute
      - key: SPRING_PROFILES_ACTIVE
        value: dev
      - key: DB_PATH
        value: /app/data/institute.db
      - key: UPLOAD_DIR
        value: /app/uploads/resumes
      - key: INSTITUTE_API_KEY
        value: inst-sec-key-7f9a12b4e8c345d6
      - key: JWT_SECRET
        value: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      - key: PORTAL_SSO_ENABLED
        value: "true"

  # ============================================================================
  # 2. Placement Pillar (Port 8082, Context /placement)
  # ============================================================================
  - type: web
    name: placement-assist-placement
    runtime: docker
    dockerContext: .
    dockerfilePath: ./placement/Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /placement/actuator/health
    envVars:
      - key: PLACEMENT_PORT
        value: 8082
      - key: CONTEXT_PATH
        value: /placement
      - key: SPRING_PROFILES_ACTIVE
        value: dev
      - key: DB_PATH
        value: /app/data/placement.db
      - key: UPLOAD_DIR
        value: /app/data/placement/uploads
      - key: INSTITUTE_URL
        value: http://placement-assist-institute:8081
      - key: INSTITUTE_API_KEY
        value: inst-sec-key-7f9a12b4e8c345d6
      - key: JWT_SECRET
        value: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      - key: PORTAL_SSO_ENABLED
        value: "true"
      - key: MAIL_MODE
        value: log

  # ============================================================================
  # 3. Portal Gateway & SSO (Port 8080, Context / - Main Public Gateway)
  # ============================================================================
  - type: web
    name: placement-assist-portal
    runtime: docker
    dockerContext: .
    dockerfilePath: ./portal/Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: PORTAL_PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: dev
      - key: DB_PATH
        value: /app/data/portal.db
      - key: INSTITUTE_URL
        value: http://placement-assist-institute:8081
      - key: PLACEMENT_URL
        value: http://placement-assist-placement:8082
      - key: INSTITUTE_API_KEY
        value: inst-sec-key-7f9a12b4e8c345d6
      - key: JWT_SECRET
        value: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      - key: MAIL_MODE
        value: log
