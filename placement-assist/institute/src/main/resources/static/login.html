<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function(){try{var s=localStorage.getItem('pa_theme_preference')||sessionStorage.getItem('pa_theme_preference');if(!s){var m=document.cookie.match(/(?:^|; )pa_theme_preference=(dark|light)/);if(m)s=m[1];}if(!s&&window.name&&window.name.indexOf('pa_theme:')!==-1){var p=window.name.split('pa_theme:')[1];if(p)s=p.split(' ')[0];}var t=(s==='dark')?'dark':'light';document.documentElement.setAttribute('data-theme',t);document.documentElement.style.colorScheme=t;}catch(e){}})();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Placement Assistance Portal</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/components.css">
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border-radius: var(--radius-lg);
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.3), 0 8px 10px -6px rgb(0 0 0 / 0.3);
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-circle mb-3" style="width: 56px; height: 56px;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
          <path d="M6 12v5c3 3 9 3 12 0v-5"/>
        </svg>
      </div>
      <h4 class="fw-bold mb-1">Placement Assistance</h4>
      <p class="text-muted small">Sign in to your campus recruitment account</p>
    </div>

    <div id="alert-box" class="alert alert-danger d-none py-2 px-3 small" role="alert"></div>

    <form id="login-form">
      <div class="mb-3">
        <label for="email" class="form-label small fw-semibold">Email Address</label>
        <input type="email" class="form-control" id="email" placeholder="name@college.edu" required autofocus>
      </div>

      <div class="mb-3">
        <div class="d-flex justify-content-between align-items-center">
          <label for="password" class="form-label small fw-semibold mb-0">Password</label>
        </div>
        <input type="password" class="form-control mt-1" id="password" placeholder="••••••••" required>
      </div>

      <button type="submit" id="submit-btn" class="btn btn-primary w-100 py-2 fw-semibold">
        Sign In
      </button>
    </form>

    <div class="mt-4 pt-3 border-top text-center">
      <p class="text-muted small mb-2">New student?</p>
      <a href="/register.html" class="btn btn-outline-secondary btn-sm w-100">
        Register as Student
      </a>
    </div>

    <!-- Quick Demo Logins -->
    <div class="mt-3 p-2 bg-light rounded text-center small text-muted">
      <div class="fw-semibold mb-1" style="font-size: 0.72rem;">Quick Fill Sample Logins:</div>
      <div class="d-flex justify-content-center gap-1">
        <button type="button" class="btn btn-xs btn-outline-primary py-0 px-2" style="font-size: 0.72rem;" onclick="fillLogin('admin@college.edu', 'Admin@123')">Admin</button>
        <button type="button" class="btn btn-xs btn-outline-info py-0 px-2" style="font-size: 0.72rem;" onclick="fillLogin('tpo@college.edu', 'Tpo@123')">TPO</button>
        <button type="button" class="btn btn-xs btn-outline-success py-0 px-2" style="font-size: 0.72rem;" onclick="fillLogin('aarav.sharma@college.edu', 'Student@123')">Student</button>
      </div>
    </div>
  </div>

  <script type="module">
    import auth from '/js/auth.js';

    window.fillLogin = function(email, password) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = password;
    };

    const form = document.getElementById('login-form');
    const alertBox = document.getElementById('alert-box');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.classList.add('d-none');
      submitBtn.disabled = true;
      submitBtn.innerText = 'Signing in...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        await auth.login(email, password);
        window.location.href = '/dashboard.html';
      } catch (err) {
        alertBox.innerText = err.message || 'Invalid email or password.';
        alertBox.classList.remove('d-none');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Sign In';
      }
    });
  </script>
</body>
</html>
