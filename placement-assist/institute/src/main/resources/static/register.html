<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration - Placement Assistance Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/components.css">
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem 1rem;
    }
    .register-card {
      width: 100%;
      max-width: 620px;
      background: #ffffff;
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.3);
    }
  </style>
</head>
<body>

  <div class="register-card">
    <div class="text-center mb-4">
      <h4 class="fw-bold mb-1">Student Registration</h4>
      <p class="text-muted small">Create your profile for campus placement opportunities</p>
    </div>

    <!-- 3-Step Wizard Indicator -->
    <div class="wizard-steps mb-4">
      <div class="wizard-step active" id="step-indicator-1">
        <div class="wizard-step-circle">1</div>
        <div class="wizard-step-title">Personal</div>
      </div>
      <div class="wizard-step" id="step-indicator-2">
        <div class="wizard-step-circle">2</div>
        <div class="wizard-step-title">Academic</div>
      </div>
      <div class="wizard-step" id="step-indicator-3">
        <div class="wizard-step-circle">3</div>
        <div class="wizard-step-title">Skills & Links</div>
      </div>
    </div>

    <div id="alert-box" class="alert alert-danger d-none py-2 px-3 small" role="alert"></div>

    <form id="register-form">
      <!-- Step 1: Personal Details -->
      <div id="step-1" class="wizard-panel">
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label small fw-semibold">Full Name *</label>
            <input type="text" id="name" class="form-control" placeholder="e.g. Aarav Sharma" required>
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold">Email Address *</label>
            <input type="email" id="email" class="form-control" placeholder="aarav.sharma@college.edu" required>
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold">Phone Number</label>
            <input type="tel" id="phone" class="form-control" placeholder="+91 9876543210">
          </div>
          <div class="col-12">
            <label class="form-label small fw-semibold">Password *</label>
            <input type="password" id="password" class="form-control" placeholder="Minimum 6 characters" minlength="6" required>
          </div>
        </div>
        <div class="d-flex justify-content-between align-items-center mt-4 pt-2">
          <a href="/login.html" class="text-muted small text-decoration-none">Already registered? Log in</a>
          <button type="button" class="btn btn-primary" onclick="goToStep(2)">Next: Academic Details &rarr;</button>
        </div>
      </div>

      <!-- Step 2: Academic Details -->
      <div id="step-2" class="wizard-panel d-none">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label small fw-semibold">Roll Number / Registration No *</label>
            <input type="text" id="rollNo" class="form-control" placeholder="e.g. 21CS01" required>
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold">Branch / Department *</label>
            <select id="branch" class="form-select" required>
              <option value="" disabled selected>Select Branch</option>
              <option value="CSE">Computer Science & Engineering (CSE)</option>
              <option value="IT">Information Technology (IT)</option>
              <option value="ECE">Electronics & Communication (ECE)</option>
              <option value="EEE">Electrical & Electronics (EEE)</option>
              <option value="MECH">Mechanical Engineering (MECH)</option>
              <option value="CIVIL">Civil Engineering (CIVIL)</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label small fw-semibold">Passing Year *</label>
            <select id="year" class="form-select" required>
              <option value="2024">2024</option>
              <option value="2025" selected>2025</option>
              <option value="2026">2026</option>
              <option value="2027">2027</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label small fw-semibold">Cumulative CGPA *</label>
            <input type="number" step="0.01" min="0" max="10" id="cgpa" class="form-control" placeholder="e.g. 8.45" required>
          </div>
          <div class="col-md-4">
            <label class="form-label small fw-semibold">Active Backlogs *</label>
            <input type="number" min="0" id="backlogs" class="form-control" value="0" required>
          </div>
        </div>
        <div class="d-flex justify-content-between align-items-center mt-4 pt-2">
          <button type="button" class="btn btn-outline-secondary" onclick="goToStep(1)">&larr; Back</button>
          <button type="button" class="btn btn-primary" onclick="goToStep(3)">Next: Skills & Links &rarr;</button>
        </div>
      </div>

      <!-- Step 3: Skills & Portfolio -->
      <div id="step-3" class="wizard-panel d-none">
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label small fw-semibold">Technical Skills (Comma separated)</label>
            <input type="text" id="skills" class="form-control" placeholder="Java, Spring Boot, React, SQL, Git">
            <div class="form-text small">Enter skills separated by commas</div>
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold">LinkedIn Profile URL</label>
            <input type="url" id="linkedin" class="form-control" placeholder="https://linkedin.com/in/username">
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold">GitHub Profile URL</label>
            <input type="url" id="github" class="form-control" placeholder="https://github.com/username">
          </div>
        </div>
        <div class="d-flex justify-content-between align-items-center mt-4 pt-2">
          <button type="button" class="btn btn-outline-secondary" onclick="goToStep(2)">&larr; Back</button>
          <button type="submit" id="submit-btn" class="btn btn-success fw-semibold">Complete Registration</button>
        </div>
      </div>
    </form>
  </div>

  <script type="module">
    import auth from '/js/auth.js';

    let currentStep = 1;
    const alertBox = document.getElementById('alert-box');

    window.goToStep = function(step) {
      alertBox.classList.add('d-none');

      if (step === 2) {
        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        if (!name || !email || !password) {
          alertBox.innerText = 'Please complete all required personal fields.';
          alertBox.classList.remove('d-none');
          return;
        }
        if (password.length < 6) {
          alertBox.innerText = 'Password must be at least 6 characters.';
          alertBox.classList.remove('d-none');
          return;
        }
      }

      if (step === 3) {
        const rollNo = document.getElementById('rollNo').value.trim();
        const branch = document.getElementById('branch').value;
        const cgpa = document.getElementById('cgpa').value;
        if (!rollNo || !branch || !cgpa) {
          alertBox.innerText = 'Please complete all required academic fields.';
          alertBox.classList.remove('d-none');
          return;
        }
      }

      // Update Panels
      document.querySelectorAll('.wizard-panel').forEach(p => p.classList.add('d-none'));
      document.getElementById('step-' + step).classList.remove('d-none');

      // Update Step Indicators
      for (let i = 1; i <= 3; i++) {
        const indicator = document.getElementById('step-indicator-' + i);
        indicator.classList.remove('active', 'completed');
        if (i < step) indicator.classList.add('completed');
        else if (i === step) indicator.classList.add('active');
      }

      currentStep = step;
    };

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.classList.add('d-none');

      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.innerText = 'Submitting...';

      const skillsInput = document.getElementById('skills').value;
      const skillsList = skillsInput ? skillsInput.split(',').map(s => s.trim()).filter(Boolean) : [];

      const payload = {
        name: document.getElementById('name').value.trim(),
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
        phone: document.getElementById('phone').value.trim() || null,
        rollNo: document.getElementById('rollNo').value.trim(),
        branch: document.getElementById('branch').value,
        year: parseInt(document.getElementById('year').value, 10),
        cgpa: parseFloat(document.getElementById('cgpa').value),
        backlogs: parseInt(document.getElementById('backlogs').value, 10),
        skills: skillsList,
        linkedin: document.getElementById('linkedin').value.trim() || null,
        github: document.getElementById('github').value.trim() || null
      };

      try {
        await auth.register(payload);
        window.location.href = '/dashboard.html';
      } catch (err) {
        alertBox.innerText = err.message || 'Registration failed. Please check your inputs.';
        alertBox.classList.remove('d-none');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Complete Registration';
      }
    });
  </script>
</body>
</html>
