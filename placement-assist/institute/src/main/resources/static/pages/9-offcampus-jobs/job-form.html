<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Posting Editor - Placement Assist</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/theme.css" rel="stylesheet">
  <link href="/css/components.css" rel="stylesheet">
</head>
<body>
  <div class="app-wrapper">
    <div id="sidebar-container"></div>
    <div class="main-content">
      <div id="topbar-container"></div>

      <main class="content-body">
        <div class="d-flex align-items-center justify-content-between mb-4">
          <div>
            <h4 class="fw-bold mb-1 text-dark" id="form-title">Post Off-Campus Job</h4>
            <p class="text-muted small mb-0">Share national recruitment openings, referral links, and corporate hiring drives.</p>
          </div>
          <a href="/institute/pages/9-offcampus-jobs/job-list.html" class="btn btn-outline-secondary btn-sm">
            &larr; Back to Jobs
          </a>
        </div>

        <div class="row justify-content-center">
          <div class="col-lg-8">
            <div class="card p-4">
              <form id="job-form" novalidate>
                <div class="row g-3">
                  <!-- Title -->
                  <div class="col-md-8">
                    <label class="form-label small fw-semibold">Position Title <span class="text-danger">*</span></label>
                    <input type="text" id="title" class="form-control" required placeholder="e.g. Associate Software Engineer">
                    <div class="invalid-feedback">Position title is required.</div>
                  </div>

                  <!-- Mode -->
                  <div class="col-md-4">
                    <label class="form-label small fw-semibold">Job Mode <span class="text-danger">*</span></label>
                    <select id="mode" class="form-select" required>
                      <option value="ONLINE">Remote (WFH)</option>
                      <option value="OFFLINE" selected>In-Office (On-Site)</option>
                      <option value="HYBRID">Hybrid</option>
                    </select>
                  </div>

                  <!-- Company -->
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold">Hiring Organization <span class="text-danger">*</span></label>
                    <input type="text" id="company" class="form-control" required placeholder="e.g. Oracle India">
                    <div class="invalid-feedback">Company name is required.</div>
                  </div>

                  <!-- Location -->
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold">Job Location</label>
                    <input type="text" id="location" class="form-control" placeholder="e.g. Hyderabad / Pune">
                  </div>

                  <!-- CTC Package -->
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold">Salary / CTC</label>
                    <input type="text" id="salaryCtc" class="form-control" placeholder="e.g. 12 - 16 LPA">
                  </div>

                  <!-- Eligible Batches -->
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold">Eligible Batches</label>
                    <input type="text" id="batchEligible" class="form-control" placeholder="e.g. 2025 / 2024 Passing Out">
                  </div>

                  <!-- Experience Required -->
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold">Experience Level</label>
                    <input type="text" id="experienceRequired" class="form-control" placeholder="e.g. Freshers / 0 - 1 Years">
                  </div>

                  <!-- Application Deadline -->
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold">Last Date to Apply <span class="text-danger">*</span></label>
                    <input type="date" id="registrationDeadline" class="form-control" required>
                  </div>

                  <!-- Apply URL -->
                  <div class="col-12">
                    <label class="form-label small fw-semibold">Application / Career Portal URL <span class="text-danger">*</span></label>
                    <input type="url" id="applyUrl" class="form-control" required placeholder="https://oracle.taleo.net/careersection/...">
                    <div class="invalid-feedback">Enter a valid job application URL.</div>
                  </div>

                  <!-- Referral Code / Notes -->
                  <div class="col-12">
                    <label class="form-label small fw-semibold">Referral Instructions / Alumni Notes</label>
                    <input type="text" id="referralCodeNotes" class="form-control" placeholder="e.g. Apply with Alumni Ref ID #ORCL-982 or email resume to alumni.contact@oracle.com">
                  </div>

                  <!-- Skills Required -->
                  <div class="col-12">
                    <label class="form-label small fw-semibold">Desired Tech Stack & Skills (Comma-separated)</label>
                    <input type="text" id="skillsRequired" class="form-control" placeholder="e.g. Java, Python, SQL, Cloud Fundamentals">
                  </div>

                  <!-- Description -->
                  <div class="col-12">
                    <label class="form-label small fw-semibold">Job Description & Hiring Process</label>
                    <textarea id="description" class="form-control" rows="4" placeholder="Overview of job responsibilities, interview rounds, eligibility percentages, and service agreement/bond details..."></textarea>
                  </div>

                  <!-- Submit -->
                  <div class="col-12 d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                    <a href="/institute/pages/9-offcampus-jobs/job-list.html" class="btn btn-light px-4">Cancel</a>
                    <button type="submit" class="btn btn-primary px-4" id="btn-save">
                      Publish Job Opening
                    </button>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import auth from '/js/auth.js';
    import api from '/js/api.js';
    import ui from '/js/ui.js';

    if (!auth.requireAuth(['ADMIN', 'TPO'])) {
      // restricted
    } else {
      ui.initLayout('jobs');

      const urlParams = new URLSearchParams(window.location.search);
      const jobId = urlParams.get('id');

      if (jobId) {
        document.getElementById('form-title').textContent = 'Edit Job Opening';
        document.getElementById('btn-save').textContent = 'Update Job';
        loadJob(jobId);
      }

      async function loadJob(id) {
        try {
          const item = await api.get(`/api/offcampus-jobs/${id}`);
          document.getElementById('title').value = item.title || '';
          document.getElementById('company').value = item.company || '';
          document.getElementById('mode').value = item.mode || 'ONLINE';
          document.getElementById('location').value = item.location || '';
          document.getElementById('salaryCtc').value = item.salaryCtc || '';
          document.getElementById('batchEligible').value = item.batchEligible || '';
          document.getElementById('experienceRequired').value = item.experienceRequired || '';
          document.getElementById('registrationDeadline').value = item.registrationDeadline || '';
          document.getElementById('applyUrl').value = item.applyUrl || '';
          document.getElementById('referralCodeNotes').value = item.referralCodeNotes || '';
          document.getElementById('skillsRequired').value = item.skillsRequired || '';
          document.getElementById('description').value = item.description || '';
        } catch (err) {
          ui.showToast('Could not load job: ' + err.message, 'danger');
        }
      }

      document.getElementById('job-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = e.target;
        if (!form.checkValidity()) {
          form.classList.add('was-validated');
          return;
        }

        const payload = {
          title: document.getElementById('title').value.trim(),
          company: document.getElementById('company').value.trim(),
          mode: document.getElementById('mode').value,
          location: document.getElementById('location').value.trim() || null,
          salaryCtc: document.getElementById('salaryCtc').value.trim() || null,
          batchEligible: document.getElementById('batchEligible').value.trim() || null,
          experienceRequired: document.getElementById('experienceRequired').value.trim() || null,
          registrationDeadline: document.getElementById('registrationDeadline').value,
          applyUrl: document.getElementById('applyUrl').value.trim(),
          referralCodeNotes: document.getElementById('referralCodeNotes').value.trim() || null,
          skillsRequired: document.getElementById('skillsRequired').value.trim() || null,
          description: document.getElementById('description').value.trim() || null
        };

        const btn = document.getElementById('btn-save');
        btn.disabled = true;
        btn.textContent = 'Saving...';

        try {
          if (jobId) {
            await api.put(`/api/offcampus-jobs/${jobId}`, payload);
            ui.showToast('Job opening updated successfully!');
          } else {
            await api.post('/api/offcampus-jobs', payload);
            ui.showToast('Off-campus job published successfully!');
          }
          setTimeout(() => {
            window.location.href = '/pages/9-offcampus-jobs/job-list.html';
          }, 800);
        } catch (err) {
          ui.showToast(err.message || 'Failed to save job', 'danger');
          btn.disabled = false;
          btn.textContent = jobId ? 'Update Job' : 'Publish Job Opening';
        }
      });
    }
  </script>
</body>
</html>
