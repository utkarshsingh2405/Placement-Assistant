<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drive Rounds Pipeline - Placement Assist</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/theme.css" rel="stylesheet">
  <link href="/css/components.css" rel="stylesheet">
  <style>
    .round-card {
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      background: #ffffff;
      padding: 1.5rem;
      position: relative;
      transition: all 0.2s ease;
    }
    .round-card:hover {
      box-shadow: var(--shadow-md);
      border-color: #cbd5e1;
    }
    .round-num-badge {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--primary);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <div class="app-wrapper">
    <div id="sidebar-container"></div>
    <div class="main-content">
      <div id="topbar-container"></div>

      <main class="content-body">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
          <div>
            <h4 class="fw-bold mb-1 text-dark">Recruitment Rounds Pipeline</h4>
            <p class="text-muted small mb-0">Track round sequence, venues, qualification cutoffs, and candidate results progression.</p>
          </div>
          <div class="d-flex gap-2">
            <a href="/institute/pages/2-company-drives/drive-list.html" class="btn btn-outline-secondary btn-sm">
              &larr; Back to Drives
            </a>
            <a href="#" class="btn btn-primary btn-sm d-flex align-items-center gap-1" id="btn-add-round">
              <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="12" y1="12" y2="12"/></svg>
              Add Next Round
            </a>
          </div>
        </div>

        <!-- Drive Selector Bar -->
        <div class="card mb-4 p-3 bg-light">
          <div class="row align-items-center g-3">
            <div class="col-md-3">
              <label class="form-label small fw-semibold mb-0">Active Campus Drive:</label>
            </div>
            <div class="col-md-9">
              <select id="drive-selector" class="form-select form-select-sm">
                <option value="">Select a drive...</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Selected Drive Header Info -->
        <div id="drive-info-banner" class="card mb-4 p-3 d-none">
          <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2">
            <div>
              <h5 class="fw-bold mb-0 text-dark" id="banner-drive-title">Drive Title</h5>
              <div class="text-muted small">
                Company: <strong class="text-dark" id="banner-company-name">--</strong>
                <span class="mx-2">•</span>
                Roles: <span id="banner-roles">--</span>
              </div>
            </div>
            <div>
              <span id="banner-status-badge" class="badge-status badge-UPCOMING">UPCOMING</span>
            </div>
          </div>
        </div>

        <!-- Rounds Container -->
        <div id="rounds-loader"></div>
        <div id="rounds-list" class="vstack gap-3"></div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import auth from '/js/auth.js';
    import api from '/js/api.js';
    import ui from '/js/ui.js';

    if (!auth.requireAuth()) {
      // redirected
    } else {
      ui.initLayout('drives');

      const urlParams = new URLSearchParams(window.location.search);
      let driveId = urlParams.get('driveId');

      if (!auth.isTpo()) {
        document.getElementById('btn-add-round')?.classList.add('d-none');
      }

      async function init() {
        await loadAllDrives();
        if (driveId) {
          document.getElementById('drive-selector').value = driveId;
          await loadDriveRounds(driveId);
        }
      }

      async function loadAllDrives() {
        try {
          const res = await api.get('/api/drives', { size: 100 });
          const drives = res.content || [];
          const select = document.getElementById('drive-selector');
          select.innerHTML = '<option value="">Choose a drive to view rounds...</option>';

          drives.forEach(d => {
            const opt = document.createElement('option');
            opt.value = d.id;
            opt.textContent = `${d.title} (${d.companyName || 'Company'}) - ${d.status}`;
            select.appendChild(opt);
          });

          if (!driveId && drives.length > 0) {
            driveId = drives[0].id;
            select.value = driveId;
          }
        } catch (err) {
          ui.showToast('Could not load drives: ' + err.message, 'danger');
        }
      }

      document.getElementById('drive-selector').addEventListener('change', (e) => {
        const val = e.target.value;
        if (val) {
          driveId = val;
          const newUrl = `${window.location.pathname}?driveId=${driveId}`;
          window.history.pushState({}, '', newUrl);
          loadDriveRounds(driveId);
        }
      });

      async function loadDriveRounds(dId) {
        const loader = document.getElementById('rounds-loader');
        const container = document.getElementById('rounds-list');
        const banner = document.getElementById('drive-info-banner');

        loader.innerHTML = ui.renderLoader('Loading rounds pipeline...');
        container.innerHTML = '';

        document.getElementById('btn-add-round').href = `/pages/5-drive-rounds/round-form.html?driveId=${dId}`;

        try {
          const drive = await api.get(`/api/drives/${dId}`);
          banner.classList.remove('d-none');
          document.getElementById('banner-drive-title').textContent = drive.title;
          document.getElementById('banner-company-name').textContent = drive.companyName || 'Company';
          document.getElementById('banner-roles').textContent = drive.roles || 'Multiple';
          const badge = document.getElementById('banner-status-badge');
          badge.className = `badge-status badge-${drive.status}`;
          badge.textContent = drive.status;

          const rounds = await api.get(`/api/rounds/drive/${dId}`);
          loader.innerHTML = '';

          if (!rounds || rounds.length === 0) {
            container.innerHTML = ui.renderEmpty('No rounds configured for this drive', 'Click "Add Next Round" above to create Round 1 (e.g. Online Aptitude / Coding Assessment).');
            return;
          }

          rounds.sort((a, b) => (a.sequence || 0) - (b.sequence || 0));

          rounds.forEach(r => {
            const card = document.createElement('div');
            card.className = 'round-card';
            card.innerHTML = `
              <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
                <div class="d-flex align-items-start gap-3">
                  <div class="round-num-badge mt-1">${r.sequence}</div>
                  <div>
                    <div class="d-flex align-items-center gap-2 mb-1">
                      <h5 class="fw-bold mb-0 text-dark">${ui.escapeHtml(r.roundName)}</h5>
                      <span class="badge bg-light text-dark border small">${ui.escapeHtml(r.roundType)}</span>
                      <span class="badge-status badge-${r.status}">${r.status}</span>
                    </div>
                    <div class="text-muted small">
                      Date: <strong class="text-dark">${r.roundDate || 'TBD'}</strong>
                      ${r.platformVenue ? ` • Venue/Link: <span class="text-dark">${ui.escapeHtml(r.platformVenue)}</span>` : ''}
                      ${r.cutoffScore ? ` • Qualifying Cutoff: <span class="text-primary fw-bold">${r.cutoffScore}</span>` : ''}
                    </div>
                    ${r.instructions ? `<div class="text-secondary small mt-2 bg-light p-2 rounded">${ui.escapeHtml(r.instructions)}</div>` : ''}
                  </div>
                </div>
                <div class="d-flex align-items-center gap-2 flex-shrink-0">
                  <a href="/institute/pages/5-drive-rounds/round-results.html?roundId=${r.id}" class="btn btn-sm btn-primary d-flex align-items-center gap-1 shadow-sm">
                    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="16 11 18 13 22 9"/></svg>
                    Candidates & Results &rarr;
                  </a>
                  ${auth.isTpo() ? `
                    <a href="/institute/pages/5-drive-rounds/round-form.html?driveId=${dId}&id=${r.id}" class="btn btn-sm btn-outline-secondary" title="Edit Round">
                      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                    </a>
                  ` : ''}
                </div>
              </div>
            `;
            container.appendChild(card);
          });

        } catch (err) {
          loader.innerHTML = ui.renderError(err.message);
        }
      }

      init();
    }
  </script>
</body>
</html>
