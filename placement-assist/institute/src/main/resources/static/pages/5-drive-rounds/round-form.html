<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Round Editor - Placement Assist</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/theme.css" rel="stylesheet">
  <link href="/css/components.css" rel="stylesheet">
</head>
<body>
  <div class="app-wrapper">
    <div id="sidebar-container"></div>
    <div class="main-content">
      <div id="topbar-container"></div>

      <main class="content-body">
        <div class="d-flex align-items-center justify-content-between mb-4">
          <div>
            <h4 class="fw-bold mb-1 text-dark" id="form-title">Add Recruitment Round</h4>
            <p class="text-muted small mb-0">Define evaluation stage, sequence order, platform venue, and qualifying cutoffs.</p>
          </div>
          <a href="#" id="link-back-board" class="btn btn-outline-secondary btn-sm">
            &larr; Back to Rounds Board
          </a>
        </div>

        <div class="row justify-content-center">
          <div class="col-lg-8">
            <div class="card p-4">
              <form id="round-form" novalidate>
                <div class="row g-3">
                  <!-- Round Name -->
                  <div class="col-md-8">
                    <label class="form-label small fw-semibold">Round Name <span class="text-danger">*</span></label>
                    <input type="text" id="roundName" class="form-control" required placeholder="e.g. Round 1: Online Technical Assessment">
                    <div class="invalid-feedback">Please enter a round name.</div>
                  </div>

                  <!-- Sequence -->
                  <div class="col-md-4">
                    <label class="form-label small fw-semibold">Sequence Order <span class="text-danger">*</span></label>
                    <input type="number" id="sequence" class="form-control" required min="1" max="15" value="1">
                  </div>

                  <!-- Round Type -->
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold">Round Type <span class="text-danger">*</span></label>
                    <select id="roundType" class="form-select" required>
                      <option value="ONLINE_TEST" selected>Online Test / Aptitude</option>
                      <option value="CODING_ROUND">Coding & DSA Assessment</option>
                      <option value="TECHNICAL_INTERVIEW">Technical Interview</option>
                      <option value="HR_INTERVIEW">HR & Behavioral Interview</option>
                      <option value="GROUP_DISCUSSION">Group Discussion (GD)</option>
                    </select>
                  </div>

                  <!-- Status -->
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold">Status</label>
                    <select id="status" class="form-select">
                      <option value="SCHEDULED" selected>SCHEDULED</option>
                      <option value="IN_PROGRESS">IN_PROGRESS</option>
                      <option value="COMPLETED">COMPLETED</option>
                      <option value="CANCELLED">CANCELLED</option>
                    </select>
                  </div>

                  <!-- Date & Cutoff -->
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold">Round Date</label>
                    <input type="date" id="roundDate" class="form-control">
                  </div>

                  <div class="col-md-6">
                    <label class="form-label small fw-semibold">Cutoff Score / Marks (Optional)</label>
                    <input type="number" id="cutoffScore" class="form-control" step="0.5" min="0" placeholder="e.g. 70.0">
                  </div>

                  <!-- Platform / Venue -->
                  <div class="col-12">
                    <label class="form-label small fw-semibold">Platform Link / Campus Venue</label>
                    <input type="text" id="platformVenue" class="form-control" placeholder="e.g. Central Computer Lab 2 or https://hackerrank.com/test-id">
                  </div>

                  <!-- Instructions -->
                  <div class="col-12">
                    <label class="form-label small fw-semibold">Round Instructions & Guidelines</label>
                    <textarea id="instructions" class="form-control" rows="3" placeholder="Syllabus, duration, webcam requirements, coding language restrictions, etc."></textarea>
                  </div>

                  <!-- Actions -->
                  <div class="col-12 d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                    <a href="#" id="link-cancel" class="btn btn-light px-4">Cancel</a>
                    <button type="submit" class="btn btn-primary px-4" id="btn-save">
                      Save Round
                    </button>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import auth from '/js/auth.js';
    import api from '/js/api.js';
    import ui from '/js/ui.js';

    if (!auth.requireAuth(['ADMIN', 'TPO'])) {
      // restricted
    } else {
      ui.initLayout('drives');

      const urlParams = new URLSearchParams(window.location.search);
      const driveId = urlParams.get('driveId');
      const roundId = urlParams.get('id');

      if (!driveId) {
        window.location.href = '/pages/2-company-drives/drive-list.html';
      }

      const backUrl = `/pages/5-drive-rounds/rounds-board.html?driveId=${driveId}`;
      document.getElementById('link-back-board').href = backUrl;
      document.getElementById('link-cancel').href = backUrl;

      if (roundId) {
        document.getElementById('form-title').textContent = 'Edit Drive Round';
        document.getElementById('btn-save').textContent = 'Update Round';
        loadRoundDetails(roundId);
      }

      async function loadRoundDetails(id) {
        try {
          const r = await api.get(`/api/rounds/${id}`);
          document.getElementById('roundName').value = r.roundName || '';
          document.getElementById('sequence').value = r.sequence || 1;
          document.getElementById('roundType').value = r.roundType || 'ONLINE_TEST';
          document.getElementById('status').value = r.status || 'SCHEDULED';
          document.getElementById('roundDate').value = r.roundDate || '';
          document.getElementById('cutoffScore').value = r.cutoffScore || '';
          document.getElementById('platformVenue').value = r.platformVenue || '';
          document.getElementById('instructions').value = r.instructions || '';
        } catch (err) {
          ui.showToast('Failed to load round details: ' + err.message, 'danger');
        }
      }

      document.getElementById('round-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = e.target;
        if (!form.checkValidity()) {
          form.classList.add('was-validated');
          return;
        }

        const payload = {
          driveId: parseInt(driveId, 10),
          roundName: document.getElementById('roundName').value.trim(),
          sequence: parseInt(document.getElementById('sequence').value || 1, 10),
          roundType: document.getElementById('roundType').value,
          status: document.getElementById('status').value,
          roundDate: document.getElementById('roundDate').value || null,
          cutoffScore: document.getElementById('cutoffScore').value ? parseFloat(document.getElementById('cutoffScore').value) : null,
          platformVenue: document.getElementById('platformVenue').value.trim() || null,
          instructions: document.getElementById('instructions').value.trim() || null
        };

        const saveBtn = document.getElementById('btn-save');
        saveBtn.disabled = true;
        saveBtn.textContent = 'Saving...';

        try {
          if (roundId) {
            await api.put(`/api/rounds/${roundId}`, payload);
            ui.showToast('Round updated successfully!');
          } else {
            await api.post('/api/rounds', payload);
            ui.showToast('Recruitment round added successfully!');
          }
          setTimeout(() => {
            window.location.href = backUrl;
          }, 800);
        } catch (err) {
          ui.showToast(err.message || 'Failed to save round', 'danger');
          saveBtn.disabled = false;
          saveBtn.textContent = roundId ? 'Update Round' : 'Save Round';
        }
      });
    }
  </script>
</body>
</html>
