<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function(){try{var s=localStorage.getItem('pa_theme_preference')||sessionStorage.getItem('pa_theme_preference');if(!s){var m=document.cookie.match(/(?:^|; )pa_theme_preference=(dark|light)/);if(m)s=m[1];}if(!s&&window.name&&window.name.indexOf('pa_theme:')!==-1){var p=window.name.split('pa_theme:')[1];if(p)s=p.split(' ')[0];}var t=(s==='dark')?'dark':'light';document.documentElement.setAttribute('data-theme',t);document.documentElement.style.colorScheme=t;}catch(e){}})();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Round Results & Shortlisting - Placement Assist</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/theme.css" rel="stylesheet">
  <link href="/css/components.css" rel="stylesheet">
</head>
<body>
  <div class="app-wrapper">
    <div id="sidebar-container"></div>
    <div class="main-content">
      <div id="topbar-container"></div>

      <main class="content-body">
        <div id="results-loader"></div>

        <div id="results-content" class="d-none">
          <!-- Round Header -->
          <div class="card mb-4 p-4">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
              <div>
                <span class="badge bg-primary text-uppercase mb-2" id="round-seq-type">Round 1 • ONLINE TEST</span>
                <h4 class="fw-bold mb-1 text-dark" id="round-name">Round Evaluation</h4>
                <div class="text-muted small">
                  Drive: <strong class="text-dark" id="round-drive-title">--</strong>
                  <span class="mx-2">•</span>
                  Date: <span id="round-date">--</span>
                  <span class="mx-2">•</span>
                  Cutoff: <span id="round-cutoff" class="fw-bold text-primary">--</span>
                </div>
              </div>
              <div class="d-flex align-items-center gap-2">
                <a href="#" id="link-back-board" class="btn btn-outline-secondary btn-sm">
                  &larr; Back to Pipeline
                </a>
                <button class="btn btn-primary btn-sm d-flex align-items-center gap-1" data-bs-toggle="modal" data-bs-target="#addCandidateModal" id="btn-add-candidate">
                  <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="12" y1="12" y2="12"/></svg>
                  Record Result
                </button>
              </div>
            </div>
          </div>

          <!-- Summary Metric Cards -->
          <div class="row g-3 mb-4">
            <div class="col-sm-4">
              <div class="card p-3 text-center">
                <div class="text-muted small fw-semibold text-uppercase">Candidates Evaluated</div>
                <h3 class="fw-bold text-dark mt-1 mb-0" id="stat-total">0</h3>
              </div>
            </div>
            <div class="col-sm-4">
              <div class="card p-3 text-center">
                <div class="text-muted small fw-semibold text-uppercase">Shortlisted / Passed</div>
                <h3 class="fw-bold text-success mt-1 mb-0" id="stat-passed">0</h3>
              </div>
            </div>
            <div class="col-sm-4">
              <div class="card p-3 text-center">
                <div class="text-muted small fw-semibold text-uppercase">Eliminated / Failed</div>
                <h3 class="fw-bold text-danger mt-1 mb-0" id="stat-failed">0</h3>
              </div>
            </div>
          </div>

          <!-- Filter Bar -->
          <div class="card mb-4 p-3">
            <div class="row g-3">
              <div class="col-md-6">
                <input type="text" id="filter-search" class="form-control form-control-sm" placeholder="Search by student name or roll number...">
              </div>
              <div class="col-md-6">
                <select id="filter-status" class="form-select form-select-sm">
                  <option value="">All Statuses</option>
                  <option value="PASSED">Passed / Shortlisted Only</option>
                  <option value="FAILED">Failed Only</option>
                  <option value="PENDING">Pending Evaluation</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Results Table -->
          <div class="card">
            <div id="table-container"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Record Candidate Result Modal -->
  <div class="modal fade" id="addCandidateModal" tabindex="-1" aria-labelledby="addCandidateModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="addCandidateModalLabel">Record Candidate Result</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="add-candidate-form" novalidate>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Select Student <span class="text-danger">*</span></label>
              <select id="modal-student-id" class="form-select" required>
                <option value="">Choose student...</option>
              </select>
            </div>
            <div class="row g-3 mb-3">
              <div class="col-6">
                <label class="form-label small fw-semibold">Score / Marks</label>
                <input type="number" id="modal-score" class="form-control" step="0.5" min="0" placeholder="e.g. 85.0">
              </div>
              <div class="col-6">
                <label class="form-label small fw-semibold">Status <span class="text-danger">*</span></label>
                <select id="modal-status" class="form-select" required>
                  <option value="PASSED">PASSED (Shortlisted)</option>
                  <option value="FAILED">FAILED (Eliminated)</option>
                  <option value="PENDING" selected>PENDING</option>
                </select>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Interviewer Feedback / Notes</label>
              <textarea id="modal-feedback" class="form-control" rows="3" placeholder="Performance feedback, technical strengths, recommendations..."></textarea>
            </div>
            <div class="d-flex justify-content-end gap-2">
              <button type="button" class="btn btn-light" data-bs-dismiss="modal">Close</button>
              <button type="submit" class="btn btn-primary" id="btn-save-candidate">Save Result</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import auth from '/js/auth.js';
    import api from '/js/api.js';
    import ui from '/js/ui.js';
    import DataTable from '/js/table.js';

    if (!auth.requireAuth()) {
      // redirected
    } else {
      ui.initLayout('drives');

      const urlParams = new URLSearchParams(window.location.search);
      const roundId = urlParams.get('roundId');

      if (!roundId) {
        window.location.href = '/pages/2-company-drives/drive-list.html';
      }

      if (!auth.isTpo()) {
        document.getElementById('btn-add-candidate')?.classList.add('d-none');
      }

      let allResults = [];
      let roundData = null;

      async function init() {
        const loader = document.getElementById('results-loader');
        const content = document.getElementById('results-content');
        loader.innerHTML = ui.renderLoader('Loading round evaluation results...');

        try {
          roundData = await api.get(`/api/rounds/${roundId}`);
          document.getElementById('round-name').textContent = roundData.roundName;
          document.getElementById('round-seq-type').textContent = `Round ${roundData.sequence} • ${roundData.roundType}`;
          document.getElementById('round-date').textContent = roundData.roundDate || 'TBD';
          document.getElementById('round-cutoff').textContent = roundData.cutoffScore ? `${roundData.cutoffScore} marks` : 'None';

          document.getElementById('link-back-board').href = `/pages/5-drive-rounds/rounds-board.html?driveId=${roundData.driveId}`;

          // Load drive details for name
          const drive = await api.get(`/api/drives/${roundData.driveId}`);
          document.getElementById('round-drive-title').textContent = `${drive.title} (${drive.companyName || 'Company'})`;

          // Load student options for modal
          loadStudentsDropdown();

          // Load results
          await fetchResults();

          loader.classList.add('d-none');
          content.classList.remove('d-none');

        } catch (err) {
          loader.innerHTML = ui.renderError(err.message);
        }
      }

      async function loadStudentsDropdown() {
        try {
          const res = await api.get('/api/students', { size: 100 });
          const students = res.content || [];
          const select = document.getElementById('modal-student-id');
          select.innerHTML = '<option value="">Choose student...</option>';
          students.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s.id;
            opt.textContent = `${s.rollNo} - ${s.name} (${s.branch})`;
            select.appendChild(opt);
          });
        } catch {}
      }

      async function fetchResults() {
        try {
          const results = await api.get(`/api/rounds/${roundId}/results`);
          allResults = results || [];

          let passed = 0;
          let failed = 0;
          allResults.forEach(r => {
            if (r.status === 'PASSED') passed++;
            if (r.status === 'FAILED') failed++;
          });

          document.getElementById('stat-total').textContent = allResults.length;
          document.getElementById('stat-passed').textContent = passed;
          document.getElementById('stat-failed').textContent = failed;

          renderTable();
        } catch (err) {
          ui.showToast('Could not load results: ' + err.message, 'danger');
        }
      }

      function renderTable() {
        const search = document.getElementById('filter-search').value.toLowerCase().trim();
        const status = document.getElementById('filter-status').value;

        const filtered = allResults.filter(r => {
          if (search && !((r.studentRollNo && r.studentRollNo.toLowerCase().includes(search)) ||
                          (r.studentName && r.studentName.toLowerCase().includes(search)))) return false;
          if (status && r.status !== status) return false;
          return true;
        });

        DataTable.render({
          containerId: 'table-container',
          columns: [
            {
              key: 'studentRollNo',
              label: 'Roll No',
              render: (item) => `<a href="/institute/pages/1-students/student-profile.html?id=${item.studentId}" class="fw-bold text-decoration-none text-primary">${ui.escapeHtml(item.studentRollNo || 'STU')}</a>`
            },
            {
              key: 'studentName',
              label: 'Candidate Name',
              render: (item) => `<span class="fw-semibold text-dark">${ui.escapeHtml(item.studentName || 'Student')}</span>`
            },
            {
              key: 'score',
              label: 'Score',
              render: (item) => item.score !== null ? `<strong>${Number(item.score).toFixed(1)}</strong>` : '<span class="text-muted">-</span>'
            },
            {
              key: 'status',
              label: 'Status',
              render: (item) => `<span class="badge-status badge-${item.status}">${ui.escapeHtml(item.status)}</span>`
            },
            {
              key: 'feedback',
              label: 'Feedback / Remarks',
              render: (item) => `<small class="text-secondary">${ui.escapeHtml(item.feedback || '-')}</small>`
            }
          ],
          data: filtered,
          emptyMessage: 'No candidate results recorded for this round yet.'
        });
      }

      document.getElementById('filter-search').addEventListener('input', renderTable);
      document.getElementById('filter-status').addEventListener('change', renderTable);

      // Add candidate result modal
      document.getElementById('add-candidate-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const studentId = document.getElementById('modal-student-id').value;
        if (!studentId) {
          ui.showToast('Please select a student', 'warning');
          return;
        }

        const payload = {
          studentId: parseInt(studentId, 10),
          score: document.getElementById('modal-score').value ? parseFloat(document.getElementById('modal-score').value) : null,
          status: document.getElementById('modal-status').value,
          feedback: document.getElementById('modal-feedback').value.trim() || null
        };

        const btn = document.getElementById('btn-save-candidate');
        btn.disabled = true;
        btn.textContent = 'Saving...';

        try {
          await api.post(`/api/rounds/${roundId}/results`, payload);
          ui.showToast('Candidate evaluation recorded successfully!');
          bootstrap.Modal.getInstance(document.getElementById('addCandidateModal')).hide();
          document.getElementById('add-candidate-form').reset();
          btn.disabled = false;
          btn.textContent = 'Save Result';
          fetchResults();
        } catch (err) {
          ui.showToast(err.message || 'Failed to save result', 'danger');
          btn.disabled = false;
          btn.textContent = 'Save Result';
        }
      });

      init();
    }
  </script>
</body>
</html>
