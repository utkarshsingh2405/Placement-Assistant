<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Internship Editor - Placement Assist</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/theme.css" rel="stylesheet">
  <link href="/css/components.css" rel="stylesheet">
</head>
<body>
  <div class="app-wrapper">
    <div id="sidebar-container"></div>
    <div class="main-content">
      <div id="topbar-container"></div>

      <main class="content-body">
        <div class="d-flex align-items-center justify-content-between mb-4">
          <div>
            <h4 class="fw-bold mb-1 text-dark" id="form-title">Post Industry Internship</h4>
            <p class="text-muted small mb-0">Publish summer internships, co-op programs, and graduate apprenticeship positions.</p>
          </div>
          <a href="/institute/pages/8-internships/internship-list.html" class="btn btn-outline-secondary btn-sm">
            &larr; Back to Internships
          </a>
        </div>

        <div class="row justify-content-center">
          <div class="col-lg-8">
            <div class="card p-4">
              <form id="internship-form" novalidate>
                <div class="row g-3">
                  <!-- Title -->
                  <div class="col-md-8">
                    <label class="form-label small fw-semibold">Role Title <span class="text-danger">*</span></label>
                    <input type="text" id="title" class="form-control" required placeholder="e.g. Software Engineer Intern (Summer 2025)">
                    <div class="invalid-feedback">Please enter the internship title.</div>
                  </div>

                  <!-- Mode -->
                  <div class="col-md-4">
                    <label class="form-label small fw-semibold">Work Mode <span class="text-danger">*</span></label>
                    <select id="mode" class="form-select" required>
                      <option value="ONLINE">Remote (WFH)</option>
                      <option value="OFFLINE" selected>In-Office (On-Site)</option>
                      <option value="HYBRID">Hybrid</option>
                    </select>
                  </div>

                  <!-- Company -->
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold">Hiring Organization / Company <span class="text-danger">*</span></label>
                    <input type="text" id="company" class="form-control" required placeholder="e.g. Cisco Systems">
                    <div class="invalid-feedback">Company name is required.</div>
                  </div>

                  <!-- Location -->
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold">Office Location</label>
                    <input type="text" id="location" class="form-control" placeholder="e.g. Bengaluru, India">
                  </div>

                  <!-- Stipend -->
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold">Monthly Stipend</label>
                    <input type="text" id="stipend" class="form-control" placeholder="e.g. ₹45,000 / month">
                  </div>

                  <!-- Duration -->
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold">Duration (Months)</label>
                    <input type="number" id="durationMonths" class="form-control" min="1" max="24" value="6">
                  </div>

                  <!-- Apply URL -->
                  <div class="col-12">
                    <label class="form-label small fw-semibold">Application Portal URL <span class="text-danger">*</span></label>
                    <input type="url" id="applyUrl" class="form-control" required placeholder="https://jobs.cisco.com/careers/...">
                    <div class="invalid-feedback">Please provide a valid application URL.</div>
                  </div>

                  <!-- Dates -->
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold">Application Deadline <span class="text-danger">*</span></label>
                    <input type="date" id="registrationDeadline" class="form-control" required>
                  </div>

                  <div class="col-md-6">
                    <label class="form-label small fw-semibold">Expected Start Date</label>
                    <input type="date" id="startDate" class="form-control">
                  </div>

                  <!-- Required Skills -->
                  <div class="col-12">
                    <label class="form-label small fw-semibold">Required Skills & Tools (Comma-separated)</label>
                    <input type="text" id="skillsRequired" class="form-control" placeholder="e.g. Java, Spring Boot, React, SQL, Git">
                  </div>

                  <!-- Description -->
                  <div class="col-12">
                    <label class="form-label small fw-semibold">Job Description & Learning Outcomes</label>
                    <textarea id="description" class="form-control" rows="4" placeholder="Responsibilities, mentor support, eligibility qualifications, and conversion to PPO potential..."></textarea>
                  </div>

                  <!-- Submit -->
                  <div class="col-12 d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                    <a href="/institute/pages/8-internships/internship-list.html" class="btn btn-light px-4">Cancel</a>
                    <button type="submit" class="btn btn-primary px-4" id="btn-save">
                      Publish Internship
                    </button>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import auth from '/js/auth.js';
    import api from '/js/api.js';
    import ui from '/js/ui.js';

    if (!auth.requireAuth(['ADMIN', 'TPO'])) {
      // restricted
    } else {
      ui.initLayout('internships');

      const urlParams = new URLSearchParams(window.location.search);
      const internshipId = urlParams.get('id');

      if (internshipId) {
        document.getElementById('form-title').textContent = 'Edit Internship Details';
        document.getElementById('btn-save').textContent = 'Update Internship';
        loadInternship(internshipId);
      }

      async function loadInternship(id) {
        try {
          const item = await api.get(`/api/internships/${id}`);
          document.getElementById('title').value = item.title || '';
          document.getElementById('company').value = item.company || '';
          document.getElementById('mode').value = item.mode || 'ONLINE';
          document.getElementById('location').value = item.location || '';
          document.getElementById('stipend').value = item.stipend || '';
          document.getElementById('durationMonths').value = item.durationMonths || 6;
          document.getElementById('applyUrl').value = item.applyUrl || '';
          document.getElementById('registrationDeadline').value = item.registrationDeadline || '';
          document.getElementById('startDate').value = item.startDate || '';
          document.getElementById('skillsRequired').value = item.skillsRequired || '';
          document.getElementById('description').value = item.description || '';
        } catch (err) {
          ui.showToast('Could not load internship: ' + err.message, 'danger');
        }
      }

      document.getElementById('internship-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = e.target;
        if (!form.checkValidity()) {
          form.classList.add('was-validated');
          return;
        }

        const payload = {
          title: document.getElementById('title').value.trim(),
          company: document.getElementById('company').value.trim(),
          mode: document.getElementById('mode').value,
          location: document.getElementById('location').value.trim() || null,
          stipend: document.getElementById('stipend').value.trim() || null,
          durationMonths: parseInt(document.getElementById('durationMonths').value || 6, 10),
          applyUrl: document.getElementById('applyUrl').value.trim(),
          registrationDeadline: document.getElementById('registrationDeadline').value,
          startDate: document.getElementById('startDate').value || null,
          skillsRequired: document.getElementById('skillsRequired').value.trim() || null,
          description: document.getElementById('description').value.trim() || null
        };

        const btn = document.getElementById('btn-save');
        btn.disabled = true;
        btn.textContent = 'Saving...';

        try {
          if (internshipId) {
            await api.put(`/api/internships/${internshipId}`, payload);
            ui.showToast('Internship updated successfully!');
          } else {
            await api.post('/api/internships', payload);
            ui.showToast('Internship published successfully!');
          }
          setTimeout(() => {
            window.location.href = '/pages/8-internships/internship-list.html';
          }, 800);
        } catch (err) {
          ui.showToast(err.message || 'Failed to save internship', 'danger');
          btn.disabled = false;
          btn.textContent = internshipId ? 'Update Internship' : 'Publish Internship';
        }
      });
    }
  </script>
</body>
</html>
