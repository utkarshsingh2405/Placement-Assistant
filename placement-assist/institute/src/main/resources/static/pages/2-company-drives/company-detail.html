<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function(){try{var s=localStorage.getItem('pa_theme_preference')||sessionStorage.getItem('pa_theme_preference');if(!s){var m=document.cookie.match(/(?:^|; )pa_theme_preference=(dark|light)/);if(m)s=m[1];}if(!s&&window.name&&window.name.indexOf('pa_theme:')!==-1){var p=window.name.split('pa_theme:')[1];if(p)s=p.split(' ')[0];}var t=(s==='dark')?'dark':'light';document.documentElement.setAttribute('data-theme',t);document.documentElement.style.colorScheme=t;}catch(e){}})();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Company Profile - Placement Assist</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/theme.css" rel="stylesheet">
  <link href="/css/components.css" rel="stylesheet">
</head>
<body>
  <div class="app-wrapper">
    <div id="sidebar-container"></div>
    <div class="main-content">
      <div id="topbar-container"></div>

      <main class="content-body">
        <div id="company-loader"></div>

        <div id="company-content" class="d-none">
          <!-- Company Header -->
          <div class="card mb-4 p-4">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
              <div class="d-flex align-items-center gap-3">
                <div class="bg-primary text-white rounded-3 d-flex align-items-center justify-content-center fw-bold fs-3" style="width: 60px; height: 60px;" id="company-avatar">
                  🏢
                </div>
                <div>
                  <h3 class="fw-bold mb-1 text-dark" id="company-name">Company Name</h3>
                  <div class="text-muted small">
                    <span id="company-industry">Technology</span>
                    <span class="mx-2">•</span>
                    <a href="#" target="_blank" id="company-website" class="text-primary text-decoration-none">Website &rarr;</a>
                  </div>
                </div>
              </div>
              <div>
                <a href="/institute/pages/2-company-drives/drive-list.html" class="btn btn-outline-secondary btn-sm">
                  &larr; Back to Drives
                </a>
              </div>
            </div>
          </div>

          <!-- Contact Information -->
          <div class="row g-4 mb-4">
            <div class="col-md-6">
              <div class="card h-100 p-3">
                <div class="fw-semibold text-muted small text-uppercase mb-2">Campus HR Contact</div>
                <div class="fw-bold text-dark fs-5" id="company-contact">--</div>
                <small class="text-muted" id="company-email">--</small>
              </div>
            </div>
            <div class="col-md-6">
              <div class="card h-100 p-3">
                <div class="fw-semibold text-muted small text-uppercase mb-2">Recruitment Drives Count</div>
                <div class="fw-bold text-primary fs-3" id="company-drives-count">0</div>
                <small class="text-muted">Total campus recruitment events</small>
              </div>
            </div>
          </div>

          <!-- Drives Hosted -->
          <div class="card">
            <div class="card-header fw-bold">Drives Hosted by this Company</div>
            <div class="card-body p-0" id="company-drives-container">
              <!-- Injected via JS -->
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import auth from '/js/auth.js';
    import api from '/js/api.js';
    import ui from '/js/ui.js';

    if (!auth.requireAuth()) {
      // redirected
    } else {
      ui.initLayout('drives');

      const urlParams = new URLSearchParams(window.location.search);
      const companyId = urlParams.get('id');

      if (!companyId) {
        window.location.href = '/pages/2-company-drives/drive-list.html';
      }

      async function init() {
        const loader = document.getElementById('company-loader');
        const content = document.getElementById('company-content');
        loader.innerHTML = ui.renderLoader('Loading company profile...');

        try {
          const company = await api.get(`/api/companies/${companyId}`);
          loader.classList.add('d-none');
          content.classList.remove('d-none');

          document.getElementById('company-name').textContent = company.name || '';
          document.getElementById('company-industry').textContent = company.industry || 'General Industry';
          document.getElementById('company-contact').textContent = company.contactPerson || 'Campus Recruitment Team';
          document.getElementById('company-email').textContent = company.contactEmail || 'Not specified';

          const webEl = document.getElementById('company-website');
          if (company.website) {
            webEl.href = company.website;
            webEl.textContent = company.website;
          } else {
            webEl.classList.add('d-none');
          }

          loadCompanyDrives(company.id);

        } catch (err) {
          loader.innerHTML = ui.renderError(err.message);
        }
      }

      async function loadCompanyDrives(cId) {
        const container = document.getElementById('company-drives-container');
        try {
          const res = await api.get('/api/drives', { companyId: cId, size: 50 });
          const drives = res.content || [];

          document.getElementById('company-drives-count').textContent = drives.length;

          if (drives.length === 0) {
            container.innerHTML = ui.renderEmpty('No drives hosted yet', 'There are no active or historical drives recorded for this company.');
            return;
          }

          let html = '<div class="list-group list-group-flush">';
          drives.forEach(d => {
            html += `
              <div class="list-group-item d-flex justify-content-between align-items-center p-3">
                <div>
                  <a href="/institute/pages/2-company-drives/drive-detail.html?id=${d.id}" class="fw-bold text-dark text-decoration-none">
                    ${ui.escapeHtml(d.title)}
                  </a>
                  <div class="text-muted small">
                    Roles: ${ui.escapeHtml(d.roles || 'Multiple')} • CTC: ${d.packageMin || 0}-${d.packageMax || 0} LPA
                  </div>
                </div>
                <div class="text-end">
                  <span class="badge-status badge-${d.status}">${d.status}</span>
                  <div class="text-muted small mt-1">Drive: ${d.driveDate || 'TBD'}</div>
                </div>
              </div>
            `;
          });
          html += '</div>';
          container.innerHTML = html;

        } catch (err) {
          container.innerHTML = `<div class="p-3 text-muted small">Could not load company drives.</div>`;
        }
      }

      init();
    }
  </script>
</body>
</html>
