<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hackathon Editor - Placement Assist</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/theme.css" rel="stylesheet">
  <link href="/css/components.css" rel="stylesheet">
</head>
<body>
  <div class="app-wrapper">
    <div id="sidebar-container"></div>
    <div class="main-content">
      <div id="topbar-container"></div>

      <main class="content-body">
        <div class="d-flex align-items-center justify-content-between mb-4">
          <div>
            <h4 class="fw-bold mb-1 text-dark" id="form-title">Post New Hackathon</h4>
            <p class="text-muted small mb-0">Share developer hackathons, collegiate challenges, and cash prize competitions.</p>
          </div>
          <a href="/institute/pages/7-hackathons/hackathon-list.html" class="btn btn-outline-secondary btn-sm">
            &larr; Back to Hackathons
          </a>
        </div>

        <div class="row justify-content-center">
          <div class="col-lg-8">
            <div class="card p-4">
              <form id="hackathon-form" novalidate>
                <div class="row g-3">
                  <!-- Title -->
                  <div class="col-md-8">
                    <label class="form-label small fw-semibold">Hackathon Title <span class="text-danger">*</span></label>
                    <input type="text" id="title" class="form-control" required placeholder="e.g. Smart India Hackathon 2025">
                    <div class="invalid-feedback">Please enter the competition title.</div>
                  </div>

                  <!-- Mode -->
                  <div class="col-md-4">
                    <label class="form-label small fw-semibold">Event Mode <span class="text-danger">*</span></label>
                    <select id="mode" class="form-select" required>
                      <option value="ONLINE" selected>Online / Virtual</option>
                      <option value="OFFLINE">In-Person (On-Site)</option>
                      <option value="HYBRID">Hybrid</option>
                    </select>
                  </div>

                  <!-- Organizer -->
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold">Host / Organizing Entity <span class="text-danger">*</span></label>
                    <input type="text" id="organizer" class="form-control" required placeholder="e.g. Ministry of Education / Tech Corp">
                    <div class="invalid-feedback">Organizer name is required.</div>
                  </div>

                  <!-- Location -->
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold">Location / Host City</label>
                    <input type="text" id="location" class="form-control" placeholder="e.g. Bengaluru / Pan-India Virtual">
                  </div>

                  <!-- Prize Pool -->
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold">Prize Pool / Rewards</label>
                    <input type="text" id="prizePool" class="form-control" placeholder="e.g. ₹5,00,000 + Pre-Placement Interviews">
                  </div>

                  <!-- Apply URL -->
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold">Official Registration URL <span class="text-danger">*</span></label>
                    <input type="url" id="applyUrl" class="form-control" required placeholder="https://unstop.com/hackathons/...">
                    <div class="invalid-feedback">Enter a valid registration URL.</div>
                  </div>

                  <!-- Dates -->
                  <div class="col-md-4">
                    <label class="form-label small fw-semibold">Registration Deadline <span class="text-danger">*</span></label>
                    <input type="date" id="registrationDeadline" class="form-control" required>
                  </div>

                  <div class="col-md-4">
                    <label class="form-label small fw-semibold">Start Date</label>
                    <input type="date" id="startDate" class="form-control">
                  </div>

                  <div class="col-md-4">
                    <label class="form-label small fw-semibold">End Date</label>
                    <input type="date" id="endDate" class="form-control">
                  </div>

                  <!-- Team Size -->
                  <div class="col-md-3">
                    <label class="form-label small fw-semibold">Min Team Size</label>
                    <input type="number" id="minTeamSize" class="form-control" min="1" value="1">
                  </div>
                  <div class="col-md-3">
                    <label class="form-label small fw-semibold">Max Team Size</label>
                    <input type="number" id="maxTeamSize" class="form-control" min="1" value="4">
                  </div>

                  <!-- Tags -->
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold">Tags (Comma-separated)</label>
                    <input type="text" id="tags" class="form-control" placeholder="e.g. Generative AI, Web3, IoT, Healthcare">
                  </div>

                  <!-- Description -->
                  <div class="col-12">
                    <label class="form-label small fw-semibold">Hackathon Description & Problem Statements</label>
                    <textarea id="description" class="form-control" rows="4" placeholder="Overview of problem themes, eligibility guidelines, evaluation rounds, and submission criteria..."></textarea>
                  </div>

                  <!-- Submit -->
                  <div class="col-12 d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                    <a href="/institute/pages/7-hackathons/hackathon-list.html" class="btn btn-light px-4">Cancel</a>
                    <button type="submit" class="btn btn-primary px-4" id="btn-save">
                      Publish Hackathon
                    </button>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import auth from '/js/auth.js';
    import api from '/js/api.js';
    import ui from '/js/ui.js';

    if (!auth.requireAuth(['ADMIN', 'TPO'])) {
      // restricted
    } else {
      ui.initLayout('hackathons');

      const urlParams = new URLSearchParams(window.location.search);
      const hackathonId = urlParams.get('id');

      if (hackathonId) {
        document.getElementById('form-title').textContent = 'Edit Hackathon Details';
        document.getElementById('btn-save').textContent = 'Update Hackathon';
        loadHackathon(hackathonId);
      }

      async function loadHackathon(id) {
        try {
          const h = await api.get(`/api/hackathons/${id}`);
          document.getElementById('title').value = h.title || '';
          document.getElementById('organizer').value = h.organizer || '';
          document.getElementById('mode').value = h.mode || 'ONLINE';
          document.getElementById('location').value = h.location || '';
          document.getElementById('prizePool').value = h.prizePool || '';
          document.getElementById('applyUrl').value = h.applyUrl || '';
          document.getElementById('registrationDeadline').value = h.registrationDeadline || '';
          document.getElementById('startDate').value = h.startDate || '';
          document.getElementById('endDate').value = h.endDate || '';
          document.getElementById('minTeamSize').value = h.minTeamSize || 1;
          document.getElementById('maxTeamSize').value = h.maxTeamSize || 4;
          document.getElementById('tags').value = h.tags || '';
          document.getElementById('description').value = h.description || '';
        } catch (err) {
          ui.showToast('Could not load hackathon: ' + err.message, 'danger');
        }
      }

      document.getElementById('hackathon-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = e.target;
        if (!form.checkValidity()) {
          form.classList.add('was-validated');
          return;
        }

        const payload = {
          title: document.getElementById('title').value.trim(),
          organizer: document.getElementById('organizer').value.trim(),
          mode: document.getElementById('mode').value,
          location: document.getElementById('location').value.trim() || null,
          prizePool: document.getElementById('prizePool').value.trim() || null,
          applyUrl: document.getElementById('applyUrl').value.trim(),
          registrationDeadline: document.getElementById('registrationDeadline').value,
          startDate: document.getElementById('startDate').value || null,
          endDate: document.getElementById('endDate').value || null,
          minTeamSize: parseInt(document.getElementById('minTeamSize').value || 1, 10),
          maxTeamSize: parseInt(document.getElementById('maxTeamSize').value || 4, 10),
          tags: document.getElementById('tags').value.trim() || null,
          description: document.getElementById('description').value.trim() || null
        };

        const btn = document.getElementById('btn-save');
        btn.disabled = true;
        btn.textContent = 'Saving...';

        try {
          if (hackathonId) {
            await api.put(`/api/hackathons/${hackathonId}`, payload);
            ui.showToast('Hackathon updated successfully!');
          } else {
            await api.post('/api/hackathons', payload);
            ui.showToast('Hackathon published successfully!');
          }
          setTimeout(() => {
            window.location.href = '/pages/7-hackathons/hackathon-list.html';
          }, 800);
        } catch (err) {
          ui.showToast(err.message || 'Failed to save hackathon', 'danger');
          btn.disabled = false;
          btn.textContent = hackathonId ? 'Update Hackathon' : 'Publish Hackathon';
        }
      });
    }
  </script>
</body>
</html>
