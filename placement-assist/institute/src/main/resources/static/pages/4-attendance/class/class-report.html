<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class Attendance Report - Placement Assist</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/theme.css" rel="stylesheet">
  <link href="/css/components.css" rel="stylesheet">
</head>
<body>
  <div class="app-wrapper">
    <div id="sidebar-container"></div>
    <div class="main-content">
      <div id="topbar-container"></div>

      <main class="content-body">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
          <div>
            <h4 class="fw-bold mb-1 text-dark">Classroom Attendance Analytics</h4>
            <p class="text-muted small mb-0">Departmental subject attendance compliance records and condonation alerts.</p>
          </div>
          <div class="d-flex gap-2">
            <button id="btn-export-csv" class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-1">
              <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
              Export CSV
            </button>
            <a href="/institute/pages/4-attendance/class/class-sessions.html" class="btn btn-outline-primary btn-sm">
              &larr; Manage Class Sessions
            </a>
          </div>
        </div>

        <!-- Metric Cards -->
        <div class="row g-3 mb-4">
          <div class="col-sm-6 col-md-4">
            <div class="card p-3 h-100">
              <div class="text-muted small fw-semibold text-uppercase">Total Class Sessions</div>
              <h3 class="fw-bold text-dark mt-2 mb-0" id="stat-total-sessions">0</h3>
              <small class="text-muted">Recorded lectures & labs</small>
            </div>
          </div>
          <div class="col-sm-6 col-md-4">
            <div class="card p-3 h-100">
              <div class="text-muted small fw-semibold text-uppercase">Students Tracked</div>
              <h3 class="fw-bold text-dark mt-2 mb-0" id="stat-total-students">0</h3>
              <small class="text-muted">Across all branches</small>
            </div>
          </div>
          <div class="col-sm-6 col-md-4">
            <div class="card p-3 h-100">
              <div class="text-muted small fw-semibold text-uppercase">Attendance Below 75%</div>
              <h3 class="fw-bold text-danger mt-2 mb-0" id="stat-shortage-students">0</h3>
              <small class="text-danger fw-semibold">Condonation list</small>
            </div>
          </div>
        </div>

        <!-- Filter Bar -->
        <div class="card mb-4 p-3">
          <div class="row g-3">
            <div class="col-md-5">
              <input type="text" id="filter-search" class="form-control form-control-sm" placeholder="Search by student roll no or name...">
            </div>
            <div class="col-sm-6 col-md-4">
              <select id="filter-branch" class="form-select form-select-sm">
                <option value="">All Branches</option>
                <option value="CSE">CSE</option>
                <option value="IT">IT</option>
                <option value="ECE">ECE</option>
                <option value="EEE">EEE</option>
                <option value="MECH">MECH</option>
                <option value="CIVIL">CIVIL</option>
              </select>
            </div>
            <div class="col-sm-6 col-md-3">
              <select id="filter-status-threshold" class="form-select form-select-sm">
                <option value="">All Attendance Levels</option>
                <option value="shortage">Below 75% (Shortage)</option>
                <option value="eligible">75% or Above</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Report Table -->
        <div class="card">
          <div id="table-container"></div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import auth from '/js/auth.js';
    import api from '/js/api.js';
    import ui from '/js/ui.js';
    import DataTable from '/js/table.js';

    if (!auth.requireAuth()) {
      // redirected
    } else {
      ui.initLayout('attendance-class');

      let studentsReportData = [];

      async function init() {
        const container = document.getElementById('table-container');
        container.innerHTML = ui.renderLoader('Compiling classroom attendance analytics...');

        try {
          const sessionsRes = await api.get('/api/class-sessions', { size: 100 });
          const sessions = Array.isArray(sessionsRes) ? sessionsRes : (sessionsRes?.content || sessionsRes?.data || []);
          const totalSessions = sessions.length;
          document.getElementById('stat-total-sessions').textContent = totalSessions;

          const studentsRes = await api.get('/api/students', { size: 100 });
          const students = Array.isArray(studentsRes) ? studentsRes : (studentsRes?.content || studentsRes?.data || []);
          document.getElementById('stat-total-students').textContent = students.length;

          let shortageCount = 0;
          const reportRows = await Promise.all(students.map(async (s) => {
            try {
              const summary = await api.get(`/api/attendance/student/${s.id}/summary`);
              const classAttended = summary.classAttended !== undefined ? summary.classAttended : (summary.attendedSessions || 0);
              const classTotal = summary.classTotal !== undefined ? summary.classTotal : (summary.totalSessions || totalSessions || 1);
              const pct = summary.classPercentage !== undefined ? Math.round(summary.classPercentage) : (classTotal > 0 ? Math.round((classAttended / classTotal) * 100) : 100);
              if (pct < 75) shortageCount++;

              return {
                id: s.id,
                rollNo: s.rollNo,
                name: s.name,
                branch: s.branch,
                attended: classAttended,
                total: classTotal,
                percentage: pct
              };
            } catch {
              return {
                id: s.id,
                rollNo: s.rollNo,
                name: s.name,
                branch: s.branch,
                attended: 0,
                total: totalSessions,
                percentage: 0
              };
            }
          }));

          document.getElementById('stat-shortage-students').textContent = shortageCount;
          studentsReportData = reportRows;
          renderTable();

        } catch (err) {
          container.innerHTML = ui.renderError(err.message);
        }
      }

      function renderTable() {
        const search = document.getElementById('filter-search').value.toLowerCase().trim();
        const branch = document.getElementById('filter-branch').value;
        const threshold = document.getElementById('filter-status-threshold').value;

        const filtered = studentsReportData.filter(item => {
          if (search && !item.rollNo.toLowerCase().includes(search) && !item.name.toLowerCase().includes(search)) return false;
          if (branch && item.branch !== branch) return false;
          if (threshold === 'shortage' && item.percentage >= 75) return false;
          if (threshold === 'eligible' && item.percentage < 75) return false;
          return true;
        });

        DataTable.render({
          containerId: 'table-container',
          columns: [
            {
              key: 'rollNo',
              label: 'Roll No',
              render: (item) => `<a href="/institute/pages/1-students/student-profile.html?id=${item.id}" class="fw-bold text-decoration-none text-primary">${ui.escapeHtml(item.rollNo)}</a>`
            },
            {
              key: 'name',
              label: 'Student Name',
              render: (item) => `<span class="fw-semibold text-dark">${ui.escapeHtml(item.name)}</span>`
            },
            {
              key: 'branch',
              label: 'Branch',
              render: (item) => `<span class="badge bg-light text-dark border">${ui.escapeHtml(item.branch)}</span>`
            },
            {
              key: 'attended',
              label: 'Classes Attended',
              render: (item) => `${item.attended} / ${item.total}`
            },
            {
              key: 'percentage',
              label: 'Attendance %',
              render: (item) => {
                const isShortage = item.percentage < 75;
                const barColor = isShortage ? 'bg-danger' : 'bg-success';
                return `
                  <div class="d-flex align-items-center gap-2" style="max-width: 180px;">
                    <div class="progress flex-grow-1" style="height: 8px;">
                      <div class="progress-bar ${barColor}" style="width: ${item.percentage}%;"></div>
                    </div>
                    <span class="small fw-bold ${isShortage ? 'text-danger' : 'text-success'}">${item.percentage}%</span>
                  </div>
                `;
              }
            },
            {
              key: 'status',
              label: 'Regular Clearance',
              render: (item) => {
                if (item.percentage >= 75) {
                  return `<span class="badge bg-success">ELIGIBLE (&ge; 75%)</span>`;
                } else {
                  return `<span class="badge bg-danger">SHORTAGE (&lt; 75%)</span>`;
                }
              }
            }
          ],
          data: filtered,
          emptyMessage: 'No attendance records match your filters.'
        });
      }

      document.getElementById('filter-search').addEventListener('input', renderTable);
      document.getElementById('filter-branch').addEventListener('change', renderTable);
      document.getElementById('filter-status-threshold').addEventListener('change', renderTable);

      document.getElementById('btn-export-csv').addEventListener('click', async () => {
        try {
          ui.showToast('Generating class attendance export...', 'info');
          await api.download('/api/attendance/export/class', 'class_attendance_report.csv');
          ui.showToast('Class attendance report downloaded!');
        } catch (err) {
          ui.showToast(err.message || 'Export failed', 'danger');
        }
      });

      init();
    }
  </script>
</body>
</html>
