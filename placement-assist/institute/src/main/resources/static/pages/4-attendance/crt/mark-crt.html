<!DOCTYPE html>
<html lang="en" data-domain="institute">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mark CRT Attendance Roster - Academic Institute</title>
  <link rel="stylesheet" href="/css/00-tokens.css">
  <link rel="stylesheet" href="/css/01-reset.css">
  <link rel="stylesheet" href="/css/02-typography.css">
  <link rel="stylesheet" href="/css/03-layout.css">
  <link rel="stylesheet" href="/css/04-components.css">
  <link rel="stylesheet" href="/css/05-patterns.css">
  <link rel="stylesheet" href="/css/06-motion.css">
  <link rel="stylesheet" href="/css/07-domains.css">
</head>
<body class="theme-ground">
  <div class="app-shell">
    <div id="sidebar-container"></div>
    <div class="app-main">
      <div id="topbar-container"></div>

      <main class="app-body" id="main-content">
        <div id="attendance-loader"></div>

        <div id="attendance-content" class="d-none">
          <!-- Session Header (Tonal Double Bezel) -->
          <div class="bezel-outer mb-6">
            <div class="bezel-inner p-6">
              <div class="d-flex flex-wrap justify-between align-center gap-4">
                <div>
                  <span class="chip chip-accent uppercase tracking-wider mb-2 d-inline-block">CRT Training Roster</span>
                  <h1 class="text-2xl fw-bold text-ink mb-1" id="session-topic">Session Topic</h1>
                  <div class="text-muted text-sm d-flex flex-wrap align-center gap-3">
                    <span>Trainer: <strong class="text-ink" id="session-trainer">--</strong></span>
                    <span>&bull;</span>
                    <span>Date: <span id="session-date" class="tabular-nums">--</span></span>
                    <span>&bull;</span>
                    <span>Duration: <span id="session-duration">--</span></span>
                  </div>
                </div>
                <div class="d-flex align-center gap-2">
                  <a href="/institute/pages/4-attendance/crt/crt-sessions.html" class="btn btn-outline">
                    <svg class="icon icon-sm"><use href="/icons/sprite.svg#arrow-left"></use></svg>
                    Sessions
                  </a>
                  <button id="btn-save-attendance" class="btn btn-primary">
                    <svg class="icon icon-sm"><use href="/icons/sprite.svg#check-circle"></use></svg>
                    Save Attendance
                  </button>
                </div>
              </div>
            </div>
          </div>

          <!-- Quick Controls Bar -->
          <div class="bezel-outer mb-6">
            <div class="bezel-inner p-4">
              <div class="d-flex flex-wrap justify-between align-center gap-3">
                <div class="d-flex align-center gap-2">
                  <span class="text-xs text-muted uppercase tracking-wider">Batch Operations:</span>
                  <button type="button" class="btn btn-secondary btn-sm" id="btn-all-present">Mark All Present</button>
                  <button type="button" class="btn btn-outline btn-sm text-danger" id="btn-all-absent">Mark All Absent</button>
                </div>
                <div class="w-auto" style="min-width: 280px;">
                  <div class="input-icon-wrap">
                    <svg class="icon input-icon"><use href="/icons/sprite.svg#magnifying-glass"></use></svg>
                    <input type="text" id="filter-student-search" class="form-control" placeholder="Filter roster by roll or name...">
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Roster Register Table -->
          <div class="card p-0 overflow-hidden mb-6">
            <div class="table-responsive">
              <table class="data-table mb-0" id="roster-table">
                <thead>
                  <tr>
                    <th style="width: 16%;">Roll Number</th>
                    <th style="width: 26%;">Candidate</th>
                    <th style="width: 14%;">Branch</th>
                    <th style="width: 26%;">Attendance Status</th>
                    <th style="width: 18%;">Remarks</th>
                  </tr>
                </thead>
                <tbody id="roster-tbody">
                  <!-- Injected via JS -->
                </tbody>
              </table>
            </div>

            <div class="p-4 border-top d-flex justify-between align-center surface-ground">
              <span class="text-xs text-muted" id="roster-summary">Showing 0 students</span>
              <button id="btn-save-attendance-bottom" class="btn btn-primary btn-sm">
                <svg class="icon icon-sm"><use href="/icons/sprite.svg#check-circle"></use></svg>
                Save Attendance
              </button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script type="module">
    import auth from '/js/auth.js';
    import api from '/js/api.js';
    import ui from '/js/ui.js';

    if (!auth.requireAuth(['ADMIN', 'TPO', 'DIRECTOR', 'STUDENT', 'STAFF'])) {
      // redirected
    } else {
      ui.initLayout('attendance-crt');

      const urlParams = new URLSearchParams(window.location.search);
      const sessionId = urlParams.get('sessionId');

      if (!sessionId) {
        window.location.href = '/institute/pages/4-attendance/crt/crt-sessions.html';
      }

      let students = [];
      let attendanceMap = {}; // studentId -> { status, remarks }

      async function init() {
        const loader = document.getElementById('attendance-loader');
        const content = document.getElementById('attendance-content');
        loader.innerHTML = ui.renderLoader('Loading training roster...');

        try {
          // 1. Load session details
          const session = await api.get(`/api/crt-sessions/${sessionId}`);
          document.getElementById('session-topic').textContent = session.topic;
          document.getElementById('session-trainer').textContent = session.trainer || 'Lead Instructor';
          document.getElementById('session-date').textContent = session.sessionDate || '-';
          document.getElementById('session-duration').textContent = `${session.durationHours || 2} hours`;

          // 2. Load existing attendance records for this session
          const existing = await api.get(`/api/attendance/session/crt/${sessionId}`);
          (existing || []).forEach(record => {
            attendanceMap[record.studentId] = {
              status: record.status,
              remarks: record.remarks || ''
            };
          });

          // 3. Load students list
          const studentsRes = await api.get('/api/students', { size: 100 });
          students = Array.isArray(studentsRes) ? studentsRes : (studentsRes?.content || studentsRes?.data || []);

          loader.classList.add('d-none');
          content.classList.remove('d-none');

          renderRoster();

        } catch (err) {
          loader.innerHTML = ui.renderError(err.message);
        }
      }

      function renderRoster(filterText = '') {
        const tbody = document.getElementById('roster-tbody');
        tbody.innerHTML = '';

        const query = filterText.toLowerCase().trim();
        const filtered = students.filter(s =>
          (s.rollNo && s.rollNo.toLowerCase().includes(query)) ||
          (s.name && s.name.toLowerCase().includes(query))
        );

        document.getElementById('roster-summary').textContent = `Showing ${filtered.length} of ${students.length} students enrolled`;

        filtered.forEach(s => {
          const currentRecord = attendanceMap[s.id] || { status: 'PRESENT', remarks: '' };
          const status = currentRecord.status || 'PRESENT';
          const remarks = currentRecord.remarks || '';
          const initials = (s.name || 'S').split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();

          const tr = document.createElement('tr');
          tr.setAttribute('data-student-id', s.id);
          tr.innerHTML = `
            <td class="font-mono fw-semibold text-ink">${ui.escapeHtml(s.rollNo)}</td>
            <td>
              <div class="d-flex align-center gap-2">
                <span class="avatar avatar-sm avatar-institute">${initials}</span>
                <div>
                  <div class="fw-semibold text-ink text-sm">${ui.escapeHtml(s.name)}</div>
                  <span class="text-xs text-muted">${ui.escapeHtml(s.email || '')}</span>
                </div>
              </div>
            </td>
            <td><span class="chip chip-muted">${ui.escapeHtml(s.branch)}</span></td>
            <td>
              <div class="segmented-control" style="max-width: 260px;">
                <label class="segmented-item ${status === 'PRESENT' ? 'active' : ''}">
                  <input type="radio" name="status-${s.id}" value="PRESENT" ${status === 'PRESENT' ? 'checked' : ''} class="sr-only">
                  Present
                </label>
                <label class="segmented-item ${status === 'ABSENT' ? 'active' : ''}">
                  <input type="radio" name="status-${s.id}" value="ABSENT" ${status === 'ABSENT' ? 'checked' : ''} class="sr-only">
                  Absent
                </label>
                <label class="segmented-item ${status === 'LATE' ? 'active' : ''}">
                  <input type="radio" name="status-${s.id}" value="LATE" ${status === 'LATE' ? 'checked' : ''} class="sr-only">
                  Late
                </label>
                <label class="segmented-item ${status === 'EXCUSED' ? 'active' : ''}">
                  <input type="radio" name="status-${s.id}" value="EXCUSED" ${status === 'EXCUSED' ? 'checked' : ''} class="sr-only">
                  Excused
                </label>
              </div>
            </td>
            <td>
              <input type="text" class="form-control form-control-sm remarks-input" value="${ui.escapeHtml(remarks)}" placeholder="Optional remarks...">
            </td>
          `;

          // Track radio changes and update visual segmented active class
          tr.querySelectorAll(`input[name="status-${s.id}"]`).forEach(radio => {
            radio.addEventListener('change', () => {
              if (!attendanceMap[s.id]) attendanceMap[s.id] = {};
              attendanceMap[s.id].status = radio.value;
              tr.querySelectorAll('.segmented-item').forEach(label => label.classList.remove('active'));
              radio.closest('.segmented-item').classList.add('active');
            });
          });

          const remarksInput = tr.querySelector('.remarks-input');
          remarksInput.addEventListener('input', () => {
            if (!attendanceMap[s.id]) attendanceMap[s.id] = { status: 'PRESENT' };
            attendanceMap[s.id].remarks = remarksInput.value.trim();
          });

          tbody.appendChild(tr);
        });
      }

      // Quick Mark All
      document.getElementById('btn-all-present').addEventListener('click', () => {
        students.forEach(s => {
          if (!attendanceMap[s.id]) attendanceMap[s.id] = {};
          attendanceMap[s.id].status = 'PRESENT';
        });
        const currentSearch = document.getElementById('filter-student-search').value;
        renderRoster(currentSearch);
      });

      document.getElementById('btn-all-absent').addEventListener('click', () => {
        students.forEach(s => {
          if (!attendanceMap[s.id]) attendanceMap[s.id] = {};
          attendanceMap[s.id].status = 'ABSENT';
        });
        const currentSearch = document.getElementById('filter-student-search').value;
        renderRoster(currentSearch);
      });

      // Filter input
      document.getElementById('filter-student-search').addEventListener('input', (e) => {
        renderRoster(e.target.value);
      });

      // Save Attendance
      async function saveAttendance() {
        if (!auth.isTpo() && !auth.hasRole('ADMIN') && !auth.hasRole('DIRECTOR')) {
          ui.showToast('You do not have permission to mark attendance.', 'warning');
          return;
        }

        const items = students.map(s => {
          const rec = attendanceMap[s.id] || { status: 'PRESENT', remarks: '' };
          return {
            studentId: s.id,
            status: rec.status || 'PRESENT',
            remarks: rec.remarks || null
          };
        });

        const payload = {
          sessionId: parseInt(sessionId, 10),
          sessionType: 'CRT',
          items: items
        };

        const btn1 = document.getElementById('btn-save-attendance');
        const btn2 = document.getElementById('btn-save-attendance-bottom');
        btn1.disabled = true;
        btn2.disabled = true;
        btn1.textContent = 'Saving...';
        btn2.textContent = 'Saving...';

        try {
          await api.post('/api/attendance/bulk', payload);
          ui.showToast(`Saved attendance for ${items.length} candidates!`);
          btn1.disabled = false;
          btn2.disabled = false;
          btn1.innerHTML = `<svg class="icon icon-sm"><use href="/icons/sprite.svg#check-circle"></use></svg> Save Attendance`;
          btn2.innerHTML = `<svg class="icon icon-sm"><use href="/icons/sprite.svg#check-circle"></use></svg> Save Attendance`;
        } catch (err) {
          ui.showToast(err.message || 'Failed to save attendance', 'danger');
          btn1.disabled = false;
          btn2.disabled = false;
          btn1.innerHTML = `<svg class="icon icon-sm"><use href="/icons/sprite.svg#check-circle"></use></svg> Save Attendance`;
          btn2.innerHTML = `<svg class="icon icon-sm"><use href="/icons/sprite.svg#check-circle"></use></svg> Save Attendance`;
        }
      }

      document.getElementById('btn-save-attendance').addEventListener('click', saveAttendance);
      document.getElementById('btn-save-attendance-bottom').addEventListener('click', saveAttendance);

      init();
    }
  </script>
</body>
</html>
