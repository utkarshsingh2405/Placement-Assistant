<!DOCTYPE html>
<html lang="en" data-theme="light" data-domain="institute">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRT Sessions — Campus Recruitment Training</title>
  
  <!-- Design System CSS -->
  <link rel="stylesheet" href="/css/00-tokens.css">
  <link rel="stylesheet" href="/css/01-reset.css">
  <link rel="stylesheet" href="/css/02-typography.css">
  <link rel="stylesheet" href="/css/03-layout.css">
  <link rel="stylesheet" href="/css/04-components.css">
  <link rel="stylesheet" href="/css/05-patterns.css">
  <link rel="stylesheet" href="/css/06-motion.css">
  <link rel="stylesheet" href="/css/07-domains.css">
</head>
<body class="theme-ground">
  <!-- Paper Grain Overlay -->
  <div class="grain-overlay"></div>

  <div class="app-shell">
    <div id="sidebar-container"></div>
    <div class="app-main">
      <div id="topbar-container"></div>

      <main class="app-body" id="main-content">
        <!-- Page Header -->
        <header class="page-header d-flex flex-wrap justify-between align-center gap-3 mb-6">
          <div>
            <div class="d-flex align-center gap-2 mb-2">
              <span class="chip chip-accent uppercase tracking-wider">Placement Training</span>
              <span class="text-xs text-muted">Aptitude, Soft-Skills & Tech Workshops</span>
            </div>
            <h1 class="page-title">CRT Training Sessions</h1>
            <p class="page-subtitle">Schedule, audit, and mark student attendance rosters for campus recruitment preparation drives.</p>
          </div>
          <div class="d-flex align-center gap-2">
            <a href="/institute/pages/4-attendance/crt/crt-report.html" class="btn btn-outline btn-sm">
              <svg class="icon icon-sm"><use href="/icons/sprite.svg#file-text"></use></svg>
              <span>Attendance Report</span>
            </a>
            <button class="btn btn-primary btn-sm" id="btn-new-session">
              <svg class="icon icon-sm"><use href="/icons/sprite.svg#plus"></use></svg>
              <span>Schedule CRT Session</span>
            </button>
          </div>
        </header>

        <!-- Filters Bar (Tonal Double Bezel) -->
        <div class="double-bezel mb-6">
          <div class="double-bezel-inner" style="padding: var(--space-4) var(--space-6);">
            <div class="d-flex flex-wrap gap-4 align-center">
              <div class="flex-1" style="min-width: 260px;">
                <div class="input-icon-wrap">
                  <svg class="input-icon"><use href="/icons/sprite.svg#magnifying-glass"/></svg>
                  <input type="text" id="filter-search" class="input input-sm" placeholder="Search by topic, trainer, or module...">
                </div>
              </div>
              <div style="min-width: 200px;">
                <input type="text" id="filter-batch" class="input input-sm" placeholder="Filter by target batch (e.g. 2025)...">
              </div>
              <div style="min-width: 170px;">
                <input type="date" id="filter-date" class="input input-sm">
              </div>
            </div>
          </div>
        </div>

        <!-- Sessions Ledger Table (Double Bezel) -->
        <div class="double-bezel">
          <div class="double-bezel-inner" style="padding: 0; overflow: hidden;">
            <div id="table-container"></div>
            <div id="pagination-container" style="padding: var(--space-4) var(--space-6); background: var(--surface-2); border-top: 1px solid var(--surface-3);"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Create Session Modal (Native Accessible Dialog) -->
  <dialog class="custom-dialog" id="newSessionModal">
    <div class="dialog-card">
      <div class="dialog-header">
        <div class="d-flex align-center gap-2">
          <div class="avatar avatar-sm avatar-institute">
            <svg class="icon icon-xs"><use href="/icons/sprite.svg#calendar-check"></use></svg>
          </div>
          <div>
            <h3 class="font-display font-semibold mb-0" style="font-size: 1.15rem;">Schedule CRT Training Session</h3>
            <p class="text-xs text-muted mb-0">Record a new technical or soft-skills preparation module</p>
          </div>
        </div>
        <button type="button" class="btn-icon" id="btn-close-modal" aria-label="Close dialog">
          <svg class="icon icon-sm"><use href="/icons/sprite.svg#x"></use></svg>
        </button>
      </div>

      <form id="new-session-form" novalidate>
        <div class="dialog-body">
          <div class="form-grid">
            <div class="form-col-12 mb-3">
              <label class="form-label" for="modal-topic">Training Topic / Module <span style="color: var(--danger);">*</span></label>
              <input type="text" id="modal-topic" class="input" required placeholder="e.g. Quantitative Aptitude: Speed Math & Combinatorics">
            </div>

            <div class="form-col-12 mb-3">
              <label class="form-label" for="modal-trainer">Trainer / Instructor <span style="color: var(--danger);">*</span></label>
              <input type="text" id="modal-trainer" class="input" required placeholder="e.g. Dr. Rajesh Verma (Lead Aptitude Trainer)">
            </div>

            <div class="form-col-6 mb-3">
              <label class="form-label" for="modal-date">Session Date <span style="color: var(--danger);">*</span></label>
              <input type="date" id="modal-date" class="input" required>
            </div>

            <div class="form-col-6 mb-3">
              <label class="form-label" for="modal-duration">Duration (Hours)</label>
              <input type="number" id="modal-duration" class="input" min="1" max="10" value="2">
            </div>

            <div class="form-col-12 mb-3">
              <label class="form-label" for="modal-batch">Target Batch / Year</label>
              <input type="text" id="modal-batch" class="input" placeholder="e.g. 2026 Batch (Final Year)">
            </div>

            <div class="form-col-12">
              <label class="form-label" for="modal-notes">Session Notes & Venue</label>
              <textarea id="modal-notes" class="input" rows="3" placeholder="Classroom venue, syllabus topics covered, or preparation links..."></textarea>
            </div>
          </div>
        </div>

        <div class="dialog-footer">
          <button type="button" class="btn btn-outline btn-sm" id="btn-cancel-modal">Cancel</button>
          <button type="submit" class="btn btn-primary btn-sm" id="btn-save-session">
            <svg class="icon icon-sm"><use href="/icons/sprite.svg#plus"></use></svg>
            <span>Schedule Session</span>
          </button>
        </div>
      </form>
    </div>
  </dialog>

  <script type="module">
    import auth from '/js/core/auth.js';
    import api from '/js/core/api.js';
    import ui from '/js/core/ui.js';
    import DataTable from '/js/table.js';
    import Pagination from '/js/pagination.js';

    if (!auth.requireAuth()) {
      // redirected
    } else {
      ui.initLayout('attendance-crt');

      const modal = document.getElementById('newSessionModal');
      const openBtn = document.getElementById('btn-new-session');
      const closeBtn = document.getElementById('btn-close-modal');
      const cancelBtn = document.getElementById('btn-cancel-modal');

      if (!auth.canManage()) {
        openBtn?.style.setProperty('display', 'none', 'important');
      }

      openBtn?.addEventListener('click', () => {
        document.getElementById('new-session-form').reset();
        document.getElementById('modal-date').valueAsDate = new Date();
        modal.showModal();
      });

      const closeModal = () => modal.close();
      closeBtn?.addEventListener('click', closeModal);
      cancelBtn?.addEventListener('click', closeModal);

      let currentPage = 0;
      const pageSize = 10;

      async function fetchSessions(page = 0) {
        currentPage = page;
        const container = document.getElementById('table-container');
        container.innerHTML = ui.renderLoader('Loading CRT sessions...');

        const search = document.getElementById('filter-search').value.trim();
        const batch = document.getElementById('filter-batch').value.trim();
        const date = document.getElementById('filter-date').value;

        const params = {
          page: currentPage,
          size: pageSize,
          search: search || undefined,
          batch: batch || undefined,
          sessionDate: date || undefined
        };

        try {
          const res = await api.get('/crt-sessions', params);
          const sessions = Array.isArray(res) ? res : (res?.content || res?.data || []);
          const totalPages = res?.totalPages || 1;
          const totalElements = res?.totalElements || sessions.length;

          if (sessions.length === 0) {
            container.innerHTML = ui.renderEmpty('No CRT training sessions scheduled', 'Click "Schedule CRT Session" to register a training workshop.');
            document.getElementById('pagination-container').innerHTML = '';
            return;
          }

          DataTable.render({
            containerId: 'table-container',
            columns: [
              {
                key: 'topic',
                label: 'Session Topic & Module',
                render: (item) => `
                  <div>
                    <div class="font-semibold text-ink">${ui.escapeHtml(item.topic)}</div>
                    <div class="text-xs text-muted">${ui.escapeHtml(item.trainer || 'Lead Instructor')}</div>
                  </div>
                `
              },
              {
                key: 'sessionDate',
                label: 'Date & Duration',
                render: (item) => `
                  <div>
                    <div class="font-semibold text-ink">${ui.escapeHtml(item.sessionDate || '-')}</div>
                    <div class="text-xs text-muted">${item.durationHours ? item.durationHours + ' hrs' : 'Standard'}</div>
                  </div>
                `
              },
              {
                key: 'batch',
                label: 'Batch',
                render: (item) => `<span class="chip chip-neutral">${ui.escapeHtml(item.batch || 'All Batches')}</span>`
              },
              {
                key: 'actions',
                label: 'Attendance Roster',
                className: 'text-end',
                render: (item) => `
                  <div class="d-flex justify-end gap-1">
                    <a href="/institute/pages/4-attendance/crt/mark-crt.html?sessionId=${item.id}" class="btn btn-sm btn-outline">
                      <svg class="icon icon-sm"><use href="/icons/sprite.svg#check"></use></svg>
                      <span>${auth.canManage() ? 'Mark / Edit Attendance' : 'View Attendance'}</span>
                    </a>
                  </div>
                `
              }
            ],
            data: sessions,
            emptyMessage: 'No CRT sessions scheduled.'
          });

          Pagination.render({
            containerId: 'pagination-container',
            currentPage: currentPage,
            totalPages: totalPages,
            totalElements: totalElements,
            pageSize: pageSize,
            onPageChange: (p) => fetchSessions(p)
          });

        } catch (err) {
          container.innerHTML = ui.renderError(err.message);
        }
      }

      // Schedule modal submit
      document.getElementById('new-session-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
          topic: document.getElementById('modal-topic').value.trim(),
          trainer: document.getElementById('modal-trainer').value.trim(),
          sessionDate: document.getElementById('modal-date').value,
          durationHours: parseInt(document.getElementById('modal-duration').value || 2, 10),
          batch: document.getElementById('modal-batch').value.trim() || null,
          notes: document.getElementById('modal-notes').value.trim() || null
        };

        const btn = document.getElementById('btn-save-session');
        btn.disabled = true;
        btn.textContent = 'Scheduling...';

        try {
          await api.post('/crt-sessions', payload);
          ui.showToast('CRT training session scheduled successfully!', 'success');
          modal.close();
          document.getElementById('new-session-form').reset();
          btn.disabled = false;
          btn.innerHTML = `<svg class="icon icon-sm"><use href="/icons/sprite.svg#plus"></use></svg><span>Schedule Session</span>`;
          fetchSessions(0);
        } catch (err) {
          ui.showToast(err.message || 'Failed to schedule session', 'danger');
          btn.disabled = false;
          btn.innerHTML = `<svg class="icon icon-sm"><use href="/icons/sprite.svg#plus"></use></svg><span>Schedule Session</span>`;
        }
      });

      let timeout;
      document.getElementById('filter-search').addEventListener('input', () => {
        clearTimeout(timeout);
        timeout = setTimeout(() => fetchSessions(0), 300);
      });
      document.getElementById('filter-batch').addEventListener('input', () => {
        clearTimeout(timeout);
        timeout = setTimeout(() => fetchSessions(0), 300);
      });
      document.getElementById('filter-date').addEventListener('change', () => fetchSessions(0));

      fetchSessions(0);
    }
  </script>
</body>
</html>
