version: '3.8'

services:
  portal:
    build:
      context: .
      dockerfile: portal/Dockerfile
    container_name: placement-assist-portal
    ports:
      - "${PORTAL_PORT:-8080}:8080"
    environment:
      - PORT=8080
      - SPRING_PROFILES_ACTIVE=dev
      - DB_PATH=/app/data/portal.db
      - JWT_SECRET=${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      - JWT_ACCESS_MINUTES=${JWT_ACCESS_MINUTES:-1440}
      - JWT_REFRESH_DAYS=${JWT_REFRESH_DAYS:-7}
      - INSTITUTE_URL=http://institute:8081
      - PLACEMENT_URL=http://placement:8082
      - INSTITUTE_API_KEY=${INSTITUTE_API_KEY:-inst-sec-key-7f9a12b4e8c345d6}
      - MAIL_MODE=${MAIL_MODE:-log}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    depends_on:
      - institute
      - placement
    restart: unless-stopped

  institute:
    build:
      context: .
      dockerfile: institute/Dockerfile
    container_name: placement-assist-institute
    ports:
      - "${INSTITUTE_PORT:-8081}:8081"
    environment:
      - PORT=8081
      - CONTEXT_PATH=/institute
      - SPRING_PROFILES_ACTIVE=dev
      - DB_PATH=/app/data/institute.db
      - UPLOAD_DIR=/app/data/institute/uploads/resumes
      - JWT_SECRET=${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      - INSTITUTE_API_KEY=${INSTITUTE_API_KEY:-inst-sec-key-7f9a12b4e8c345d6}
      - PORTAL_SSO_ENABLED=${PORTAL_SSO_ENABLED:-true}
      - PORTAL_URL=http://portal:8080
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/institute/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    restart: unless-stopped

  placement:
    build:
      context: .
      dockerfile: placement/Dockerfile
    container_name: placement-assist-placement
    ports:
      - "${PLACEMENT_PORT:-8082}:8082"
    environment:
      - PORT=8082
      - CONTEXT_PATH=/placement
      - SPRING_PROFILES_ACTIVE=dev
      - DB_PATH=/app/data/placement.db
      - UPLOAD_DIR=/app/data/placement/uploads
      - INSTITUTE_URL=http://institute:8081
      - INSTITUTE_MODE=${INSTITUTE_MODE:-live}
      - INSTITUTE_API_KEY=${INSTITUTE_API_KEY:-inst-sec-key-7f9a12b4e8c345d6}
      - JWT_SECRET=${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      - PORTAL_SSO_ENABLED=${PORTAL_SSO_ENABLED:-true}
      - PORTAL_URL=http://portal:8080
      - MAIL_MODE=${MAIL_MODE:-log}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:admin@placementassist.edu}
      - PUBLIC_SHOW_STUDENT_NAMES=${PUBLIC_SHOW_STUDENT_NAMES:-true}
      - PUBLIC_SHOW_PACKAGES=${PUBLIC_SHOW_PACKAGES:-true}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/placement/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    restart: unless-stopped
