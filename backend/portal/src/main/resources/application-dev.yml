server:
  port: 8080

spring:
  jpa:
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    com.placementassist.portal: INFO
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN
    org.apache.tomcat.util.http.parser.Cookie: ERROR
    org.flywaydb: INFO
