spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlite:${DB_PATH:database/institute.db}}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.sqlite.JDBC}
    hikari:
      maximum-pool-size: 1
      minimum-idle: 1
      connection-init-sql: "PRAGMA foreign_keys = ON; PRAGMA journal_mode = WAL;"
      pool-name: SQLiteHikariPoolInstitute

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update

  flyway:
    enabled: false
