<!DOCTYPE html>
<html lang="en" data-domain="placement">
<head>
  <script>
    (function(){try{var s=localStorage.getItem('pa_theme_preference')||sessionStorage.getItem('pa_theme_preference');if(!s){var m=document.cookie.match(/(?:^|; )pa_theme_preference=(dark|light)/);if(m)s=m[1];}if(!s&&window.name&&window.name.indexOf('pa_theme:')!==-1){var p=window.name.split('pa_theme:')[1];if(p)s=p.split(' ')[0];}var t=(s==='dark')?'dark':'light';document.documentElement.setAttribute('data-theme',t);document.documentElement.style.colorScheme=t;}catch(e){}})();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recruitment Drives - Placement Season</title>
  <link rel="stylesheet" href="/css/00-tokens.css">
  <link rel="stylesheet" href="/css/01-reset.css">
  <link rel="stylesheet" href="/css/02-typography.css">
  <link rel="stylesheet" href="/css/03-layout.css">
  <link rel="stylesheet" href="/css/04-components.css">
  <link rel="stylesheet" href="/css/05-patterns.css">
  <link rel="stylesheet" href="/css/06-motion.css">
  <link rel="stylesheet" href="/css/07-domains.css">
</head>
<body class="theme-ground">
  <div class="app-shell">
    <div id="sidebar-container"></div>
    <div class="app-main">
      <div id="topbar-container"></div>

      <main class="app-body" id="main-content">
        <!-- Page Header -->
        <header class="page-header d-flex flex-wrap justify-between align-center gap-3 mb-6">
          <div>
            <div class="d-flex align-center gap-2 mb-2">
              <span class="chip chip-accent uppercase tracking-wider">Placement Season</span>
              <span class="text-xs text-muted">Active Hiring Cycles</span>
            </div>
            <h1 class="page-title">Campus Recruitment Drives</h1>
            <p class="page-subtitle">Track enterprise hiring rounds, application eligibility, live stages, and official selection offers.</p>
          </div>
          <div class="d-flex align-center gap-2" id="tpo-actions-container">
            <!-- Injected by script for TPO/Director -->
          </div>
        </header>

        <!-- Filters Bar (Tonal Double Bezel) -->
        <div class="bezel-outer mb-6">
          <div class="bezel-inner p-4">
            <div class="form-grid g-3 align-center">
              <div class="form-col-5">
                <label for="drive-search-input" class="form-label">Search Season Directory</label>
                <div class="input-icon-wrap">
                  <svg class="icon input-icon"><use href="/icons/sprite.svg#magnifying-glass"></use></svg>
                  <input type="text" id="drive-search-input" class="form-control" placeholder="Search by company or job role...">
                </div>
              </div>
              <div class="form-col-4">
                <label for="status-filter-select" class="form-label">Drive Lifecycle</label>
                <select id="status-filter-select" class="form-select">
                  <option value="" selected>All Drive Statuses</option>
                  <option value="ACTIVE">Active &amp; Ongoing Now</option>
                  <option value="UPCOMING">Upcoming Scheduled</option>
                  <option value="COMPLETED">Completed Cycles</option>
                </select>
              </div>
              <div class="form-col-3 text-end pt-4">
                <span class="text-xs text-muted tabular-nums" id="drive-count-badge">Loading drives...</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Drives Grid Container -->
        <div class="bento-grid mb-6" id="drives-grid">
          <div style="grid-column: 1 / -1;" class="text-center py-6 text-muted">
            <div class="spinner-modern mb-3"></div>
            <div>Fetching campus recruitment drives...</div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Launch Drive Modal (Native Accessible Dialog) -->
  <dialog id="createDriveModal" class="custom-dialog">
    <div class="dialog-card">
      <form id="create-drive-form">
        <div class="dialog-header d-flex justify-between align-center p-4 border-bottom">
          <h3 class="text-lg fw-semibold text-ink mb-0" id="createDriveModalLabel">Launch New Placement Drive</h3>
          <button type="button" class="btn-icon" id="btn-close-drive-modal" aria-label="Close dialog">
            <svg class="icon icon-sm"><use href="/icons/sprite.svg#x"></use></svg>
          </button>
        </div>

        <div class="dialog-body p-5">
          <div class="form-grid g-3">
            <div class="form-col-6">
              <label class="form-label">Company Name *</label>
              <input type="text" name="companyName" class="form-control" required placeholder="e.g. Microsoft India">
            </div>
            <div class="form-col-6">
              <label class="form-label">Job Title / Designation *</label>
              <input type="text" name="title" class="form-control" required placeholder="e.g. Software Engineer - Cloud">
            </div>
            <div class="form-col-4">
              <label class="form-label">Package (CTC in LPA) *</label>
              <input type="number" step="0.1" name="packageLpa" class="form-control" required placeholder="e.g. 18.5">
            </div>
            <div class="form-col-4">
              <label class="form-label">Scheduled Date *</label>
              <input type="date" name="driveDate" class="form-control" required>
            </div>
            <div class="form-col-4">
              <label class="form-label">Hiring Status</label>
              <select name="status" class="form-select">
                <option value="ACTIVE" selected>ACTIVE / ONGOING</option>
                <option value="UPCOMING">UPCOMING</option>
              </select>
            </div>
            <div class="form-col-6">
              <label class="form-label">Eligible Branches (comma-separated)</label>
              <input type="text" name="eligibleBranches" class="form-control" placeholder="e.g. CSE, IT, ECE">
            </div>
            <div class="form-col-6">
              <label class="form-label">Min CGPA Threshold</label>
              <input type="number" step="0.01" name="minCgpa" class="form-control" placeholder="e.g. 7.5">
            </div>
            <div class="form-col-12">
              <label class="form-label">Job Description &amp; Technical Scope</label>
              <textarea name="description" class="form-control" rows="3" placeholder="Specify roles, technical requirements, and interview procedure..."></textarea>
            </div>
          </div>
        </div>

        <div class="dialog-footer p-4 border-top d-flex justify-end gap-2 surface-ground">
          <button type="button" class="btn btn-secondary btn-sm" id="btn-cancel-drive-modal">Cancel</button>
          <button type="submit" class="btn btn-primary btn-sm">Launch Drive</button>
        </div>
      </form>
    </div>
  </dialog>

  <script type="module">
    import auth from '/js/auth.js';
    import ui from '/js/ui.js';
    import api from '/js/api.js';

    if (!auth.requireAuth(['ADMIN', 'TPO', 'DIRECTOR', 'STUDENT', 'STAFF', 'COMPANY'])) {
      // redirected
    } else {
      const user = auth.getUser();
      ui.initLayout('drives');

      let allDrives = [];
      const isTpoOrDirector = user?.role === 'TPO' || user?.role === 'DIRECTOR' || user?.role === 'ADMIN';

      // Inject TPO actions
      if (isTpoOrDirector) {
        document.getElementById('tpo-actions-container').innerHTML = `
          <button type="button" class="btn btn-primary" id="btn-open-create-drive">
            <svg class="icon icon-sm"><use href="/icons/sprite.svg#plus"></use></svg>
            <span>Post New Drive</span>
          </button>
        `;

        document.getElementById('btn-open-create-drive')?.addEventListener('click', () => {
          const dialog = document.getElementById('createDriveModal');
          if (dialog.showModal) dialog.showModal();
          else dialog.setAttribute('open', 'true');
        });
      }

      window.deleteDriveRecord = async function(id, title) {
        const confirmed = await ui.confirm('Delete Recruitment Drive', `Are you sure you want to permanently delete "${title}"? All associated stages and candidate records will be removed.`);
        if (!confirmed) return;

        try {
          await api.delete(`/drives/${id}`);
          ui.showToast(`Drive "${title}" deleted successfully.`, 'success');
          loadDrives();
        } catch (err) {
          ui.showToast(err.message || 'Failed to delete drive', 'danger');
        }
      };

      async function loadDrives() {
        const grid = document.getElementById('drives-grid');
        grid.innerHTML = `<div style="grid-column: 1 / -1;">${ui.renderLoader('Fetching campus recruitment drives...')}</div>`;

        try {
          const res = await api.get('/drives/all');
          allDrives = Array.isArray(res) ? res : (res?.data || res?.content || []);
          renderDrives();
        } catch {
          grid.innerHTML = `<div style="grid-column: 1 / -1;">${ui.renderError('Failed to load drives from server. Verify connection to Placement pillar.')}</div>`;
        }
      }

      function renderDrives() {
        const search = document.getElementById('drive-search-input').value.toLowerCase().trim();
        const statusFilter = document.getElementById('status-filter-select').value;

        let filtered = allDrives.filter(d => {
          const name = (d.company?.name || d.companyName || '').toLowerCase();
          const title = (d.title || '').toLowerCase();
          const matchesSearch = !search || name.includes(search) || title.includes(search);
          
          let matchesStatus = true;
          if (statusFilter === 'ACTIVE') {
            matchesStatus = (d.status === 'ACTIVE' || d.status === 'ONGOING');
          } else if (statusFilter) {
            matchesStatus = (d.status === statusFilter);
          }
          return matchesSearch && matchesStatus;
        });

        document.getElementById('drive-count-badge').textContent = `Showing ${filtered.length} of ${allDrives.length} drives`;

        const grid = document.getElementById('drives-grid');
        if (filtered.length === 0) {
          grid.innerHTML = `
            <div style="grid-column: 1 / -1;">
              ${ui.renderEmpty('No recruitment drives found', 'Try adjusting your search query or selecting a different lifecycle status.')}
            </div>
          `;
          return;
        }

        grid.innerHTML = filtered.map(d => {
          const companyName = d.company?.name || d.companyName || 'Recruiting Partner';
          const initial = companyName.charAt(0).toUpperCase();
          const ctc = d.packageLpa ? `${d.packageLpa} LPA` : (d.salaryRange || 'Competitive CTC');
          const isOngoing = d.status === 'ONGOING' || d.status === 'ACTIVE';
          const statusClass = isOngoing ? 'status-placed' : (d.status === 'UPCOMING' ? 'status-warning' : 'status-neutral');
          const stagesCount = d.stages ? d.stages.length : 6;

          return `
            <article class="bezel-outer poster-card">
              <div class="bezel-inner p-5 d-flex flex-column h-100 justify-between">
                <div>
                  <div class="d-flex justify-between align-start gap-2 mb-3">
                    <div class="d-flex align-center gap-3">
                      <span class="avatar avatar-md avatar-placement">${initial}</span>
                      <div>
                        <h3 class="poster-title text-base mb-0 text-truncate" style="max-width: 180px;">
                          ${ui.escapeHtml(companyName)}
                        </h3>
                        <span class="text-xs text-muted">${ui.escapeHtml(d.location || 'On-Campus / Hybrid')}</span>
                      </div>
                    </div>
                    <span class="status-chip ${statusClass}">
                      <span class="status-dot"></span>
                      ${isOngoing ? 'Active Now' : ui.escapeHtml(d.status)}
                    </span>
                  </div>

                  <h4 class="text-sm fw-semibold text-ink mb-2 text-truncate">${ui.escapeHtml(d.title || 'Graduate Trainee')}</h4>
                  <p class="text-xs text-ink-2 lh-relaxed mb-3" style="min-height: 38px;">
                    ${ui.escapeHtml(d.description || 'Full-time campus recruitment role with comprehensive training, competitive package, and structured progression.')}
                  </p>

                  <div class="surface-tone p-3 rounded-3 mb-3 d-flex justify-between align-center">
                    <div>
                      <span class="text-xs text-muted d-block">Package (CTC)</span>
                      <strong class="text-sm text-placement tabular-nums">${ui.escapeHtml(ctc)}</strong>
                    </div>
                    <div class="text-end">
                      <span class="text-xs text-muted d-block">Assessment</span>
                      <strong class="text-sm text-ink tabular-nums">${stagesCount} Stages</strong>
                    </div>
                  </div>
                </div>

                <div class="pt-3 border-top d-flex justify-between align-center">
                  <div class="text-xs text-muted">
                    <span class="d-block">Date</span>
                    <strong class="text-ink tabular-nums">${d.driveDate ? new Date(d.driveDate).toLocaleDateString() : 'Active Season'}</strong>
                  </div>
                  <div class="d-flex gap-1 align-center">
                    <a href="/placement/pages/1-drives/drive-detail.html?id=${d.id}" class="btn-pill-nested" title="View Drive Specification">
                      <span>View</span>
                      <span class="btn-nested-circle">
                        <svg class="icon icon-xs"><use href="/icons/sprite.svg#arrow-up-right"></use></svg>
                      </span>
                    </a>
                    ${isTpoOrDirector ? `
                      <button onclick="deleteDriveRecord(${d.id}, '${ui.escapeHtml(d.title || '').replace(/'/g, "\\'")}')" class="btn btn-outline btn-sm text-danger p-2" title="Delete Drive">
                        <svg class="icon icon-xs"><use href="/icons/sprite.svg#trash"></use></svg>
                      </button>
                    ` : ''}
                  </div>
                </div>
              </div>
            </article>
          `;
        }).join('');
      }

      // Filter listeners
      document.getElementById('drive-search-input').addEventListener('input', renderDrives);
      document.getElementById('status-filter-select').addEventListener('change', renderDrives);

      const modalEl = document.getElementById('createDriveModal');
      document.getElementById('btn-close-drive-modal')?.addEventListener('click', () => modalEl.close ? modalEl.close() : modalEl.removeAttribute('open'));
      document.getElementById('btn-cancel-drive-modal')?.addEventListener('click', () => modalEl.close ? modalEl.close() : modalEl.removeAttribute('open'));

      // Form submit for TPO create drive
      document.getElementById('create-drive-form')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = e.target;
        const data = {
          companyName: form.companyName.value.trim(),
          title: form.title.value.trim(),
          packageLpa: parseFloat(form.packageLpa.value),
          driveDate: form.driveDate.value,
          status: form.status.value,
          eligibleBranches: form.eligibleBranches.value.trim(),
          minCgpa: form.minCgpa.value ? parseFloat(form.minCgpa.value) : null,
          description: form.description.value.trim()
        };

        try {
          await api.post('/drives', data);
          ui.showToast('Recruitment drive launched successfully!');
          if (modalEl.close) modalEl.close();
          else modalEl.removeAttribute('open');
          form.reset();
          loadDrives();
        } catch (err) {
          ui.showToast(err.message || 'Failed to create drive', 'danger');
        }
      });

      loadDrives();
    }
  </script>
</body>
</html>
