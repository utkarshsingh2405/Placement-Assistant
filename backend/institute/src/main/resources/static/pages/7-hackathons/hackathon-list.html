<!DOCTYPE html>
<html lang="en" data-domain="institute">
<head>
  <script>
    (function(){try{var s=localStorage.getItem('pa_theme_preference')||sessionStorage.getItem('pa_theme_preference');if(!s){var m=document.cookie.match(/(?:^|; )pa_theme_preference=(dark|light)/);if(m)s=m[1];}if(!s&&window.name&&window.name.indexOf('pa_theme:')!==-1){var p=window.name.split('pa_theme:')[1];if(p)s=p.split(' ')[0];}var t=(s==='dark')?'dark':'light';document.documentElement.setAttribute('data-theme',t);document.documentElement.style.colorScheme=t;}catch(e){}})();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>National Hackathons & Challenges — Academic Institute</title>
  
  <!-- Preload Display Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/00-tokens.css">
  <link rel="stylesheet" href="/css/01-reset.css">
  <link rel="stylesheet" href="/css/02-typography.css">
  <link rel="stylesheet" href="/css/03-layout.css">
  <link rel="stylesheet" href="/css/04-components.css">
  <link rel="stylesheet" href="/css/05-patterns.css">
  <link rel="stylesheet" href="/css/06-motion.css">
  <link rel="stylesheet" href="/css/07-domains.css">
  <style>
    .opportunity-card {
      transition: transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
    }
    .opportunity-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-float);
    }
    .hover-underline:hover {
      text-decoration: underline !important;
    }
  </style>
</head>
<body class="theme-ground">
  <!-- Paper Grain Overlay -->
  <div class="grain-overlay"></div>

  <div class="app-shell">
    <div id="sidebar-container"></div>
    <div class="app-main">
      <div id="topbar-container"></div>

      <main class="app-body" id="main-content">
        <!-- Page Header -->
        <header class="page-header d-flex flex-wrap justify-between align-center gap-3 mb-6">
          <div>
            <div style="display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-1);">
              <span class="chip" style="background: var(--institute-tint); color: var(--institute); font-weight: 600;">
                COMPETITIONS & SPRINTS
              </span>
              <span class="text-muted text-xs">National & Collegiate Ledger 2026</span>
            </div>
            <h1 class="page-title">National & Global Hackathons</h1>
            <p class="page-subtitle">Verified engineering hackathons, open innovation bounties, and corporate hiring sprints.</p>
          </div>
          <div class="d-flex gap-2">
            <a href="/institute/pages/7-hackathons/hackathon-form.html" class="btn btn-primary" id="btn-add-hackathon">
              <svg class="icon icon-sm"><use href="/icons/sprite.svg#plus"></use></svg>
              <span>Post Opportunity</span>
            </a>
          </div>
        </header>

        <!-- Filter Bar (Tonal Double Bezel) -->
        <div class="bezel-outer mb-6">
          <div class="bezel-inner p-4">
            <div class="form-grid g-3 align-center">
              <div class="form-col-5">
                <label for="filter-search" class="form-label">Search Hackathons</label>
                <div class="input-icon-wrap">
                  <svg class="icon input-icon"><use href="/icons/sprite.svg#magnifying-glass"></use></svg>
                  <input type="text" id="filter-search" class="form-control" placeholder="Search by title, organizer, or tech stack...">
                </div>
              </div>
              <div class="form-col-3">
                <label for="filter-mode" class="form-label">Format / Mode</label>
                <select id="filter-mode" class="form-select">
                  <option value="">All Formats</option>
                  <option value="ONLINE">Online / Virtual</option>
                  <option value="OFFLINE">In-Person (On-Site)</option>
                  <option value="HYBRID">Hybrid Model</option>
                </select>
              </div>
              <div class="form-col-4 d-flex align-center pt-4">
                <label class="custom-toggle d-flex align-center gap-2 cursor-pointer">
                  <input type="checkbox" id="filter-bookmarked" class="toggle-checkbox">
                  <span class="text-sm fw-semibold text-ink">Saved & Bookmarked Only</span>
                </label>
              </div>
            </div>
          </div>
        </div>

        <!-- Hackathons Responsive Grid -->
        <div id="hackathons-loading"></div>
        <div id="hackathons-grid" class="opportunities-grid mb-6"></div>
        <div id="pagination-container" class="mt-4"></div>
      </main>
    </div>
  </div>

  <script type="module">
    import auth from '/js/auth.js';
    import api from '/js/api.js';
    import ui from '/js/ui.js';
    import Pagination from '/js/pagination.js';

    if (!auth.requireAuth(['ADMIN', 'TPO', 'DIRECTOR', 'STUDENT', 'STAFF'])) {
      // redirected
    } else {
      ui.initLayout('hackathons');

      if (!auth.isTpo() && !auth.hasRole('ADMIN') && !auth.hasRole('DIRECTOR')) {
        document.getElementById('btn-add-hackathon')?.classList.add('d-none');
      }

      let currentPage = 0;
      const pageSize = 9;

      async function fetchHackathons(page = 0) {
        currentPage = page;
        const loader = document.getElementById('hackathons-loading');
        const grid = document.getElementById('hackathons-grid');
        loader.innerHTML = ui.renderLoader('Loading active competitions...');
        grid.innerHTML = '';

        const search = document.getElementById('filter-search').value.trim();
        const mode = document.getElementById('filter-mode').value;
        const onlyBookmarked = document.getElementById('filter-bookmarked').checked;

        try {
          let hackathons = [];
          let totalPages = 1;
          let totalElements = 0;

          if (onlyBookmarked) {
            const list = await api.get('/api/hackathons/bookmarked');
            hackathons = list || [];
            totalElements = hackathons.length;
          } else {
            const res = await api.get('/api/hackathons', {
              page: currentPage,
              size: pageSize,
              search: search || undefined,
              mode: mode || undefined
            });
            hackathons = res.content || [];
            totalPages = res.totalPages || 1;
            totalElements = res.totalElements || 0;
          }

          loader.innerHTML = '';

          if (hackathons.length === 0) {
            grid.innerHTML = `<div style="grid-column: 1 / -1;">${ui.renderEmpty('No competitions found', 'No active competitions matched your filters.')}</div>`;
            return;
          }

          hackathons.forEach(h => {
            const title = h.name || h.title || 'National Hackathon';
            const organizer = h.organizer || 'Organizing Body';
            const location = h.location || '';
            const prize = h.prize || h.prizePool || 'Bounties & PPI Offers';
            const teamSize = h.teamSize || h.maxTeamSize;
            const deadline = h.registrationDeadline || h.deadline || 'Rolling';
            const modeVal = (h.mode || 'ONLINE').toUpperCase();
            const realLink = h.link || h.applyUrl || '#';
            const description = h.description || 'Visit official competition portal for complete track specifications and submission rubrics.';
            const isBookmarked = !!h.bookmarked;

            let modeChipStyle = 'background: rgba(14, 165, 233, 0.12); color: #0284c7;';
            if (modeVal === 'OFFLINE') {
              modeChipStyle = 'background: rgba(16, 185, 129, 0.12); color: #059669;';
            } else if (modeVal === 'HYBRID') {
              modeChipStyle = 'background: rgba(245, 158, 11, 0.12); color: #d97706;';
            }

            const rawTags = h.tags || (h.skillsRequired || 'AI/ML, Web3, Cloud, Open Innovation');
            const tags = rawTags.split(',').filter(Boolean).slice(0, 4).map(t => `<span class="chip chip-muted" style="font-size: 11px;">${ui.escapeHtml(t.trim())}</span>`).join(' ');

            const card = document.createElement('article');
            card.className = 'bezel-outer opportunity-card h-100';
            card.innerHTML = `
              <div class="bezel-inner p-5 d-flex flex-column h-100 justify-between">
                <div>
                  <div class="d-flex justify-between align-center mb-3">
                    <div class="d-flex align-center gap-2">
                      <span class="chip uppercase tracking-wider text-xs fw-semibold" style="${modeChipStyle}">${ui.escapeHtml(modeVal)}</span>
                      <span class="chip chip-muted text-xs uppercase" style="font-size: 10px; font-weight: 600;">ACTIVE</span>
                    </div>
                    <button type="button" class="btn-icon bookmark-btn" data-id="${h.id}" title="Toggle Bookmark" aria-label="Bookmark">
                      <svg class="icon icon-sm" style="${isBookmarked ? 'fill: var(--brass); stroke: var(--brass);' : ''}"><use href="/icons/sprite.svg#bookmark-simple"></use></svg>
                    </button>
                  </div>

                  <h3 class="poster-title text-lg mb-2" style="line-height: 1.35; min-height: 2.7rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
                    <a href="/institute/pages/7-hackathons/hackathon-detail.html?id=${h.id}" class="text-ink text-decoration-none hover-underline" title="${ui.escapeHtml(title)}">
                      ${ui.escapeHtml(title)}
                    </a>
                  </h3>
                  
                  <div class="text-xs text-muted mb-3 d-flex align-center gap-2 flex-wrap">
                    <div class="d-flex align-center gap-1">
                      <svg class="icon icon-xs"><use href="/icons/sprite.svg#buildings"></use></svg>
                      <span class="fw-semibold text-ink-2">${ui.escapeHtml(organizer)}</span>
                    </div>
                    ${location ? `<span>&bull;</span> <span class="text-muted">${ui.escapeHtml(location)}</span>` : ''}
                  </div>

                  <p class="text-xs text-muted mb-3" style="line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
                    ${ui.escapeHtml(description)}
                  </p>

                  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); margin-bottom: var(--space-3);" class="text-center">
                    <div class="p-2 surface-tone rounded-3" style="background: var(--surface-2); border-radius: var(--radius-sm);">
                      <span class="text-xs text-muted d-block" style="font-size: 10px; text-transform: uppercase; font-weight: 600; letter-spacing: 0.04em;">Prizes & Perks</span>
                      <strong class="text-xs text-placement tabular-nums" style="font-size: 12px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${ui.escapeHtml(prize)}">${ui.escapeHtml(prize)}</strong>
                    </div>
                    <div class="p-2 surface-tone rounded-3" style="background: var(--surface-2); border-radius: var(--radius-sm);">
                      <span class="text-xs text-muted d-block" style="font-size: 10px; text-transform: uppercase; font-weight: 600; letter-spacing: 0.04em;">Team Size</span>
                      <strong class="text-xs text-ink tabular-nums" style="font-size: 12px; display: block;">${teamSize ? (teamSize === 1 ? 'Solo Hacker' : teamSize + ' Members') : 'Teams (2-4)'}</strong>
                    </div>
                  </div>

                  <div class="mb-2">
                    <div class="d-flex flex-wrap gap-1">
                      ${tags}
                    </div>
                  </div>
                </div>

                <div class="pt-4 border-top d-flex justify-between align-center gap-2 mt-4">
                  <div style="min-width: 0;">
                    <span class="text-xs text-muted d-block" style="white-space: nowrap; font-size: 11px;">Registration Closes</span>
                    <strong class="text-xs text-institute tabular-nums" style="white-space: nowrap; font-weight: 600;">${ui.escapeHtml(deadline)}</strong>
                  </div>
                  <div class="d-flex align-center gap-2">
                    <a href="/institute/pages/7-hackathons/hackathon-detail.html?id=${h.id}" class="btn-pill-nested" title="View Specifications">
                      <span>Inspect</span>
                      <span class="btn-nested-circle">
                        <svg class="icon icon-xs"><use href="/icons/sprite.svg#arrow-up-right"></use></svg>
                      </span>
                    </a>
                    ${realLink && realLink !== '#' ? `
                      <a href="${ui.escapeHtml(realLink)}" target="_blank" rel="noopener noreferrer" class="btn btn-outline" style="padding: 4px 8px; font-size: 11px; white-space: nowrap; border-radius: 9999px; display: inline-flex; align-items: center; gap: 3px;" title="Open Official Website">
                        <span>Portal</span>
                        <svg class="icon" style="width: 10px; height: 10px;"><use href="/icons/sprite.svg#arrow-up-right"></use></svg>
                      </a>
                    ` : ''}
                  </div>
                </div>
              </div>
            `;

            const starBtn = card.querySelector('.bookmark-btn');
            starBtn.addEventListener('click', async (e) => {
              e.preventDefault();
              try {
                const res = await api.post(`/api/hackathons/${h.id}/bookmark`);
                const svg = starBtn.querySelector('svg');
                if (res.bookmarked) {
                  svg.style.fill = 'var(--brass)';
                  svg.style.stroke = 'var(--brass)';
                } else {
                  svg.style.fill = 'none';
                  svg.style.stroke = 'currentColor';
                }
                ui.showToast(res.bookmarked ? 'Saved to bookmarks dossier!' : 'Removed from saved bookmarks');
              } catch (err) {
                ui.showToast(err.message || 'Bookmark toggle failed', 'danger');
              }
            });

            grid.appendChild(card);
          });

          if (!onlyBookmarked) {
            Pagination.render({
              containerId: 'pagination-container',
              currentPage: currentPage,
              totalPages: totalPages,
              totalElements: totalElements,
              pageSize: pageSize,
              onPageChange: (p) => fetchHackathons(p)
            });
          }

        } catch (err) {
          loader.innerHTML = ui.renderError(err.message);
        }
      }

      let timeout;
      document.getElementById('filter-search').addEventListener('input', () => {
        clearTimeout(timeout);
        timeout = setTimeout(() => fetchHackathons(0), 300);
      });
      document.getElementById('filter-mode').addEventListener('change', () => fetchHackathons(0));
      document.getElementById('filter-bookmarked').addEventListener('change', () => fetchHackathons(0));

      fetchHackathons(0);
    }
  </script>
</body>
</html>
