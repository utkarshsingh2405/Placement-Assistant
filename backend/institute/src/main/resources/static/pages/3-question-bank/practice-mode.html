<!DOCTYPE html>
<html lang="en" data-theme="light" data-domain="institute">
<head>
  <script>
    (function(){try{var s=localStorage.getItem('pa_theme_preference')||sessionStorage.getItem('pa_theme_preference');if(!s){var m=document.cookie.match(/(?:^|; )pa_theme_preference=(dark|light)/);if(m)s=m[1];}if(!s&&window.name&&window.name.indexOf('pa_theme:')!==-1){var p=window.name.split('pa_theme:')[1];if(p)s=p.split(' ')[0];}var t=(s==='dark')?'dark':'light';document.documentElement.setAttribute('data-theme',t);document.documentElement.style.colorScheme=t;}catch(e){}})();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practice Mode — Question Bank Flashcard Stack</title>
  
  <!-- Design System CSS -->
  <link rel="stylesheet" href="/css/00-tokens.css">
  <link rel="stylesheet" href="/css/01-reset.css">
  <link rel="stylesheet" href="/css/02-typography.css">
  <link rel="stylesheet" href="/css/03-layout.css">
  <link rel="stylesheet" href="/css/04-components.css">
  <link rel="stylesheet" href="/css/05-patterns.css">
  <link rel="stylesheet" href="/css/06-motion.css">
  <link rel="stylesheet" href="/css/07-domains.css">

  <style>
    .flashcard-stack {
      perspective: 1200px;
      max-width: 760px;
      margin: var(--space-6) auto;
    }
    .flashcard-card {
      background: var(--surface);
      border-radius: var(--radius-outer);
      padding: var(--space-8);
      border: 1px solid var(--surface-3);
      box-shadow: var(--shadow-dialog);
      position: relative;
      min-height: 440px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform var(--dur-normal) var(--ease-out);
    }
    .mcq-option {
      background: var(--surface-2);
      border: 1px solid var(--surface-3);
      border-radius: var(--radius-control);
      padding: 12px 16px;
      font-size: var(--text-sm);
      cursor: pointer;
      transition: all var(--dur-fast) var(--ease-out);
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }
    .mcq-option:hover {
      border-color: var(--accent);
      background: var(--surface);
    }
    .mcq-option.selected {
      border-color: var(--accent);
      background: var(--accent-tint);
      font-weight: 600;
    }
    .mcq-option.correct {
      border-color: var(--success);
      background: var(--success-tint);
      color: var(--success);
      font-weight: 600;
    }
    .mcq-option.incorrect {
      border-color: var(--danger);
      background: var(--danger-tint);
      color: var(--danger);
    }
  </style>
</head>
<body>
  <div class="grain-overlay"></div>

  <div class="app-shell">
    <div id="sidebar-container"></div>
    <div class="app-main">
      <div id="topbar-container"></div>

      <main class="app-body">
        <!-- Stage 1: Setup Screen -->
        <div id="stage-setup" style="max-width: 560px; margin: var(--space-8) auto;">
          <div class="double-bezel">
            <div class="double-bezel-inner" style="text-align: center;">
              <div style="width: 56px; height: 56px; border-radius: 50%; background: var(--surface-2); color: var(--accent); display: flex; align-items: center; justify-content: center; margin: 0 auto var(--space-4);">
                <svg width="28" height="28"><use href="#ph-clipboard-text"/></svg>
              </div>

              <h2 class="font-display" style="font-size: 1.85rem; margin-bottom: var(--space-2);">Practice Flashcard Stack</h2>
              <p class="text-muted text-sm" style="margin-bottom: var(--space-6);">
                Configure questions and difficulty for a keyboard-driven mock interview drill.
              </p>

              <div style="text-align: left; display: flex; flex-direction: column; gap: var(--space-4);">
                <div class="form-group" style="margin-bottom: 0;">
                  <label class="form-label">Subject Category</label>
                  <select id="setup-category" class="select-field">
                    <option value="">All Categories (Mixed Mock Drill)</option>
                    <option value="APTITUDE">Aptitude & Quantitative Reasoning</option>
                    <option value="CODING">Data Structures & Algorithms</option>
                    <option value="TECHNICAL">Core Computer Science (OS / Networks / DBMS)</option>
                    <option value="HR">HR & Behavioral Scenarios</option>
                  </select>
                </div>

                <div class="form-group" style="margin-bottom: 0;">
                  <label class="form-label">Difficulty Filter</label>
                  <select id="setup-difficulty" class="select-field">
                    <option value="">Any Difficulty</option>
                    <option value="EASY">Easy (Foundations)</option>
                    <option value="MEDIUM" selected>Medium (Standard Campus Cutoff)</option>
                    <option value="HARD">Hard (Tier-1 Hiring Rounds)</option>
                  </select>
                </div>

                <div class="form-group" style="margin-bottom: 0;">
                  <label class="form-label">Stack Card Count</label>
                  <select id="setup-limit" class="select-field">
                    <option value="5">5 Cards (Quick Sprint)</option>
                    <option value="10" selected>10 Cards (Standard Mock)</option>
                    <option value="20">20 Cards (Deep Revision)</option>
                  </select>
                </div>

                <div style="margin-top: var(--space-4);">
                  <button id="btn-start-session" class="btn btn-primary btn-lg" style="width: 100%;">
                    <span>Launch Flashcard Drill</span>
                    <svg width="16" height="16"><use href="#ph-arrow-right"/></svg>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Stage 2: Question Active Flashcard Session -->
        <div id="stage-active" style="display: none;">
          <div style="display: flex; justify-content: space-between; align-items: center; max-width: 760px; margin: 0 auto var(--space-4);">
            <div style="display: flex; align-items: center; gap: var(--space-2);">
              <span class="chip chip-neutral" id="q-category-badge">APTITUDE</span>
              <span class="chip chip-warning" id="q-difficulty-badge">MEDIUM</span>
              <span class="text-muted text-xs font-monospace" id="q-counter">Card 1 of 10</span>
            </div>
            <div style="display: flex; align-items: center; gap: var(--space-3);">
              <span class="chip chip-danger font-monospace" style="font-size: 13px;">
                <svg width="14" height="14"><use href="#ph-clock"/></svg>
                <span id="session-timer">00:00</span>
              </span>
              <div style="font-size: 11px; color: var(--muted); border-left: 1px solid var(--surface-3); padding-left: var(--space-2);">
                <kbd>Space</kbd> Flip • <kbd>→</kbd> Next
              </div>
            </div>
          </div>

          <!-- The Physical Flashcard -->
          <div class="flashcard-stack">
            <div class="flashcard-card">
              <div>
                <h3 style="font-size: 1.25rem; margin-bottom: var(--space-3);" id="q-title">Question Prompt</h3>
                <div style="font-size: var(--text-body); line-height: 1.6; color: var(--ink-2); margin-bottom: var(--space-6);" id="q-text"></div>

                <!-- MCQ Options Stack -->
                <div id="q-options-container" style="display: flex; flex-direction: column; gap: var(--space-3); margin-bottom: var(--space-6);"></div>

                <!-- Solution & Answer (Hidden initially) -->
                <div id="q-solution-alert" style="display: none; background: var(--surface-2); border-left: 4px solid var(--success); padding: var(--space-4); border-radius: var(--radius-control); margin-bottom: var(--space-4);">
                  <div style="font-size: var(--text-xs); font-weight: 700; color: var(--success); text-transform: uppercase; margin-bottom: 4px;">
                    CORRECT SOLUTION
                  </div>
                  <div id="q-correct-answer-text" style="font-weight: 600; color: var(--ink); margin-bottom: 6px;"></div>
                  <div id="q-explanation-text" style="font-size: var(--text-sm); color: var(--ink-2); line-height: 1.5;"></div>
                </div>
              </div>

              <!-- Card Action Bar -->
              <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--surface-3); padding-top: var(--space-4); margin-top: var(--space-4);">
                <button id="btn-reveal-solution" class="btn btn-outline">
                  <span>Reveal Solution (Space)</span>
                </button>
                <button id="btn-next-question" class="btn btn-primary">
                  <span>Next Card</span>
                  <svg width="14" height="14"><use href="#ph-arrow-right"/></svg>
                </button>
              </div>
            </div>
          </div>
        </div>

        <div id="stage-summary" style="display: none;"></div>
      </main>
    </div>
  </div>

  <div id="sprite-container" style="display: none;"></div>

  <script type="module">
    import auth from '/js/core/auth.js';
    import api from '/js/core/api.js';
    import ui from '/js/core/ui.js';

    fetch('/icons/sprite.svg').then(r => r.text()).then(svg => {
      document.getElementById('sprite-container').innerHTML = svg;
    });

    if (!auth.requireAuth()) {
      // redirected
    }

    ui.initLayout('questions');

    const stageSetup = document.getElementById('stage-setup');
    const stageActive = document.getElementById('stage-active');
    const stageSummary = document.getElementById('stage-summary');
    const btnStart = document.getElementById('btn-start-session');
    const btnReveal = document.getElementById('btn-reveal-solution');
    const btnNext = document.getElementById('btn-next-question');
    const solutionAlert = document.getElementById('q-solution-alert');

    let questions = [];
    let currentIndex = 0;
    let timerSeconds = 0;
    let timerInterval = null;

    btnStart.addEventListener('click', async () => {
      const cat = document.getElementById('setup-category').value;
      const diff = document.getElementById('setup-difficulty').value;
      const limit = document.getElementById('setup-limit').value;

      btnStart.disabled = true;
      btnStart.textContent = 'Loading questions...';

      try {
        let url = `/api/questions?size=${limit}`;
        if (cat) url += `&category=${cat}`;
        if (diff) url += `&difficulty=${diff}`;
        const res = await api.get(url);
        questions = res?.content || (Array.isArray(res) ? res : (res?.data?.content || []));

        if (questions.length === 0) {
          // Fallback mock questions if bank empty
          questions = [
            {
              id: '1',
              title: 'Binary Tree Level Order Traversal',
              text: 'Given the root of a binary tree, return the level order traversal of its nodes values (i.e., from left to right, level by level).\n\nWhat is the time complexity of BFS traversal?',
              category: 'CODING',
              difficulty: 'MEDIUM',
              options: ['O(N) Time and O(N) Space', 'O(Log N) Time and O(1) Space', 'O(N^2) Time and O(N) Space', 'O(1) Time and O(N) Space'],
              correctAnswer: 'O(N) Time and O(N) Space',
              explanation: 'Standard BFS queue visits every node exactly once (O(N) time) and holds at most N/2 nodes in queue at the widest level (O(N) space).'
            },
            {
              id: '2',
              title: 'Database Normalization',
              text: 'A relation is in BCNF (Boyce-Codd Normal Form) if and only if for every functional dependency X -> Y:',
              category: 'TECHNICAL',
              difficulty: 'MEDIUM',
              options: ['X is a super key', 'Y is a prime attribute', 'X is not composite', 'Relation is already in 2NF only'],
              correctAnswer: 'X is a super key',
              explanation: 'BCNF is a stricter version of 3NF. For every non-trivial functional dependency X -> Y, X must be a super key of the relation.'
            }
          ];
        }

        stageSetup.style.display = 'none';
        stageActive.style.display = 'block';
        currentIndex = 0;
        showQuestion(currentIndex);
        startTimer();
      } catch (err) {
        ui.toast(err.message, 'danger');
        btnStart.disabled = false;
        btnStart.textContent = 'Launch Flashcard Drill';
      }
    });

    function startTimer() {
      timerSeconds = 0;
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timerSeconds++;
        const mins = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
        const secs = String(timerSeconds % 60).padStart(2, '0');
        document.getElementById('session-timer').textContent = `${mins}:${secs}`;
      }, 1000);
    }

    function showQuestion(idx) {
      if (idx >= questions.length) {
        finishSession();
        return;
      }

      const q = questions[idx];
      document.getElementById('q-title').textContent = q.title || `Question ${idx + 1}`;
      document.getElementById('q-text').textContent = q.text || q.description || '';
      document.getElementById('q-counter').textContent = `Card ${idx + 1} of ${questions.length}`;
      document.getElementById('q-category-badge').textContent = q.category || 'GENERAL';
      document.getElementById('q-difficulty-badge').textContent = q.difficulty || 'MEDIUM';

      solutionAlert.style.display = 'none';
      btnReveal.textContent = 'Reveal Solution (Space)';

      // Options
      const optionsContainer = document.getElementById('q-options-container');
      const opts = q.options || ['Option A', 'Option B', 'Option C', 'Option D'];
      optionsContainer.innerHTML = opts.map(opt => `
        <div class="mcq-option" data-val="${ui.escapeHtml(opt)}">
          <span style="width: 22px; height: 22px; border-radius: 50%; background: var(--surface-3); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600;">•</span>
          <span>${ui.escapeHtml(opt)}</span>
        </div>
      `).join('');

      optionsContainer.querySelectorAll('.mcq-option').forEach(el => {
        el.addEventListener('click', () => {
          optionsContainer.querySelectorAll('.mcq-option').forEach(o => o.classList.remove('selected'));
          el.classList.add('selected');
        });
      });
    }

    function reveal() {
      const q = questions[currentIndex];
      solutionAlert.style.display = 'block';
      document.getElementById('q-correct-answer-text').textContent = `Answer: ${q.correctAnswer || 'Correct Solution'}`;
      document.getElementById('q-explanation-text').textContent = q.explanation || 'No detailed rationale provided for this item.';
      btnReveal.textContent = 'Solution Revealed';

      // Highlight options if matched
      document.querySelectorAll('.mcq-option').forEach(el => {
        if (el.dataset.val === q.correctAnswer) {
          el.classList.add('correct');
        }
      });
    }

    btnReveal.addEventListener('click', reveal);
    btnNext.addEventListener('click', () => {
      currentIndex++;
      showQuestion(currentIndex);
    });

    // Spacebar to flip/reveal, ArrowRight for next
    window.addEventListener('keydown', (e) => {
      if (stageActive.style.display === 'block') {
        if (e.code === 'Space' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
          e.preventDefault();
          reveal();
        } else if (e.code === 'ArrowRight' && e.target.tagName !== 'INPUT') {
          e.preventDefault();
          currentIndex++;
          showQuestion(currentIndex);
        }
      }
    });

    function finishSession() {
      clearInterval(timerInterval);
      stageActive.style.display = 'none';
      stageSummary.style.display = 'block';
      stageSummary.innerHTML = `
        <div class="double-bezel" style="max-width: 520px; margin: var(--space-8) auto;">
          <div class="double-bezel-inner" style="text-align: center;">
            <div style="width: 56px; height: 56px; border-radius: 50%; background: var(--success-tint); color: var(--success); display: flex; align-items: center; justify-content: center; margin: 0 auto var(--space-4);">
              <svg width="28" height="28"><use href="#ph-check"/></svg>
            </div>
            <h2 class="font-display" style="font-size: 1.8rem; margin-bottom: var(--space-2);">Drill Complete.</h2>
            <p class="text-muted text-sm" style="margin-bottom: var(--space-6);">
              You reviewed ${questions.length} cards in ${document.getElementById('session-timer').textContent}.
            </p>
            <div style="display: flex; justify-content: center; gap: var(--space-3);">
              <button class="btn btn-outline" onclick="window.location.reload()">Start New Session</button>
              <a href="/institute/pages/3-question-bank/question-list.html" class="btn btn-primary">Browse All Questions</a>
            </div>
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
