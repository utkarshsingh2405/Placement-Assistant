<!DOCTYPE html>
<html lang="en" data-domain="institute">
<head>
  <script>
    (function(){try{var s=localStorage.getItem('pa_theme_preference')||sessionStorage.getItem('pa_theme_preference');if(!s){var m=document.cookie.match(/(?:^|; )pa_theme_preference=(dark|light)/);if(m)s=m[1];}if(!s&&window.name&&window.name.indexOf('pa_theme:')!==-1){var p=window.name.split('pa_theme:')[1];if(p)s=p.split(' ')[0];}var t=(s==='dark')?'dark':'light';document.documentElement.setAttribute('data-theme',t);document.documentElement.style.colorScheme=t;}catch(e){}})();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Off-Campus Opportunity Editor — Academic Institute</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/00-tokens.css">
  <link rel="stylesheet" href="/css/01-reset.css">
  <link rel="stylesheet" href="/css/02-typography.css">
  <link rel="stylesheet" href="/css/03-layout.css">
  <link rel="stylesheet" href="/css/04-components.css">
  <link rel="stylesheet" href="/css/05-patterns.css">
  <link rel="stylesheet" href="/css/06-motion.css">
  <link rel="stylesheet" href="/css/07-domains.css">
</head>
<body class="theme-ground">
  <div class="app-shell">
    <div id="sidebar-container"></div>
    <div class="app-main">
      <div id="topbar-container"></div>

      <main class="app-body" id="main-content">
        <!-- Header -->
        <header class="page-header d-flex flex-wrap justify-between align-center gap-3 mb-6">
          <div>
            <div class="d-flex align-center gap-2 mb-1">
              <a href="/institute/pages/9-offcampus-jobs/job-list.html" class="text-xs text-muted text-decoration-none">&larr; Back to Listings</a>
              <span class="text-xs text-muted">&bull;</span>
              <span class="chip chip-muted uppercase text-xs">Section 09</span>
            </div>
            <h1 class="page-title" id="form-title">Post Off-Campus Job</h1>
            <p class="page-subtitle">Publish verified external tech openings, pool campus drives, and company referral links.</p>
          </div>
          <div class="d-flex gap-2">
            <a href="/institute/pages/9-offcampus-jobs/job-list.html" class="btn btn-secondary">Discard</a>
          </div>
        </header>

        <!-- Form Card (Double Bezel) -->
        <div class="bezel-outer mb-8" style="max-width: 960px; margin: 0 auto;">
          <div class="bezel-inner p-6">
            <form id="job-form" novalidate>
              <div class="form-grid g-4">
                <!-- Title -->
                <div class="form-col-8">
                  <label class="form-label fw-semibold" for="title">Position / Role Title <span class="text-danger">*</span></label>
                  <input type="text" id="title" class="form-control" required placeholder="e.g. Associate Software Engineer">
                </div>

                <!-- Mode -->
                <div class="form-col-4">
                  <label class="form-label fw-semibold" for="mode">Work Mode <span class="text-danger">*</span></label>
                  <select id="mode" class="form-select" required>
                    <option value="ONLINE">Remote (WFH)</option>
                    <option value="OFFLINE" selected>In-Office (On-Site)</option>
                    <option value="HYBRID">Hybrid Model</option>
                  </select>
                </div>

                <!-- Company -->
                <div class="form-col-6">
                  <label class="form-label fw-semibold" for="company">Hiring Organization / Employer <span class="text-danger">*</span></label>
                  <input type="text" id="company" class="form-control" required placeholder="e.g. Oracle India">
                </div>

                <!-- Location -->
                <div class="form-col-6">
                  <label class="form-label fw-semibold" for="location">Job Location</label>
                  <input type="text" id="location" class="form-control" placeholder="e.g. Hyderabad / Pune">
                </div>

                <!-- CTC -->
                <div class="form-col-6">
                  <label class="form-label fw-semibold" for="salaryCtc">Compensation / CTC Package</label>
                  <input type="text" id="salaryCtc" class="form-control" placeholder="e.g. 12 - 16 LPA">
                </div>

                <!-- Eligible Batches -->
                <div class="form-col-6">
                  <label class="form-label fw-semibold" for="batchEligible">Eligible Batches</label>
                  <input type="text" id="batchEligible" class="form-control" placeholder="e.g. 2025 / 2024 Passing Out">
                </div>

                <!-- Experience -->
                <div class="form-col-6">
                  <label class="form-label fw-semibold" for="experienceRequired">Experience Band</label>
                  <input type="text" id="experienceRequired" class="form-control" placeholder="e.g. Freshers / 0 - 1 Years">
                </div>

                <!-- Deadline -->
                <div class="form-col-6">
                  <label class="form-label fw-semibold" for="registrationDeadline">Registration Cutoff <span class="text-danger">*</span></label>
                  <input type="date" id="registrationDeadline" class="form-control" required>
                </div>

                <!-- Apply URL -->
                <div class="form-col-12">
                  <label class="form-label fw-semibold" for="applyUrl">Official Career / Application URL <span class="text-danger">*</span></label>
                  <input type="url" id="applyUrl" class="form-control" required placeholder="https://oracle.taleo.net/careersection/...">
                </div>

                <!-- Referral Notes -->
                <div class="form-col-12">
                  <label class="form-label fw-semibold" for="referralCodeNotes">Referral Instructions / Alumni Notes</label>
                  <input type="text" id="referralCodeNotes" class="form-control" placeholder="e.g. Apply with Alumni Ref ID #ORCL-982 or email resume to alumni.contact@oracle.com">
                </div>

                <!-- Skills -->
                <div class="form-col-12">
                  <label class="form-label fw-semibold" for="skillsRequired">Key Competencies & Tech Stack (Comma-separated)</label>
                  <input type="text" id="skillsRequired" class="form-control" placeholder="e.g. Java, Python, SQL, Cloud Fundamentals">
                </div>

                <!-- Description -->
                <div class="form-col-12">
                  <label class="form-label fw-semibold" for="description">Job Description & Hiring Process</label>
                  <textarea id="description" class="form-control" rows="5" placeholder="Overview of job responsibilities, interview rounds, eligibility percentages, and service agreement/bond details..."></textarea>
                </div>

                <!-- Submit Bar -->
                <div class="form-col-12 d-flex justify-end gap-3 mt-4 pt-4 border-top">
                  <a href="/institute/pages/9-offcampus-jobs/job-list.html" class="btn btn-secondary px-5">Cancel</a>
                  <button type="submit" class="btn btn-primary px-6" id="btn-save">Publish Job Opening</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script type="module">
    import auth from '/js/auth.js';
    import api from '/js/api.js';
    import ui from '/js/ui.js';

    if (!auth.requireAuth(['ADMIN', 'TPO'])) {
      // restricted
    } else {
      ui.initLayout('jobs');

      const urlParams = new URLSearchParams(window.location.search);
      const jobId = urlParams.get('id');

      if (jobId) {
        document.getElementById('form-title').textContent = 'Edit Job Opening';
        document.getElementById('btn-save').textContent = 'Update Job';
        loadJob(jobId);
      }

      async function loadJob(id) {
        try {
          const item = await api.get(`/api/offcampus-jobs/${id}`);
          document.getElementById('title').value = item.title || '';
          document.getElementById('company').value = item.company || '';
          document.getElementById('mode').value = item.mode || 'ONLINE';
          document.getElementById('location').value = item.location || '';
          document.getElementById('salaryCtc').value = item.salaryCtc || '';
          document.getElementById('batchEligible').value = item.batchEligible || '';
          document.getElementById('experienceRequired').value = item.experienceRequired || '';
          document.getElementById('registrationDeadline').value = item.registrationDeadline || '';
          document.getElementById('applyUrl').value = item.applyUrl || '';
          document.getElementById('referralCodeNotes').value = item.referralCodeNotes || '';
          document.getElementById('skillsRequired').value = item.skillsRequired || '';
          document.getElementById('description').value = item.description || '';
        } catch (err) {
          ui.showToast('Could not load job: ' + err.message, 'danger');
        }
      }

      document.getElementById('job-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = e.target;
        if (!form.checkValidity()) {
          form.reportValidity();
          return;
        }

        const payload = {
          title: document.getElementById('title').value.trim(),
          company: document.getElementById('company').value.trim(),
          mode: document.getElementById('mode').value,
          location: document.getElementById('location').value.trim() || null,
          salaryCtc: document.getElementById('salaryCtc').value.trim() || null,
          batchEligible: document.getElementById('batchEligible').value.trim() || null,
          experienceRequired: document.getElementById('experienceRequired').value.trim() || null,
          registrationDeadline: document.getElementById('registrationDeadline').value,
          applyUrl: document.getElementById('applyUrl').value.trim(),
          referralCodeNotes: document.getElementById('referralCodeNotes').value.trim() || null,
          skillsRequired: document.getElementById('skillsRequired').value.trim() || null,
          description: document.getElementById('description').value.trim() || null
        };

        const btn = document.getElementById('btn-save');
        btn.disabled = true;
        btn.textContent = 'Saving...';

        try {
          if (jobId) {
            await api.put(`/api/offcampus-jobs/${jobId}`, payload);
            ui.showToast('Job opening updated successfully!');
          } else {
            await api.post('/api/offcampus-jobs', payload);
            ui.showToast('Off-campus job published successfully!');
          }
          setTimeout(() => {
            window.location.href = '/institute/pages/9-offcampus-jobs/job-list.html';
          }, 600);
        } catch (err) {
          ui.showToast(err.message || 'Failed to save job', 'danger');
          btn.disabled = false;
          btn.textContent = jobId ? 'Update Job' : 'Publish Job Opening';
        }
      });
    }
  </script>
</body>
</html>
