<!DOCTYPE html>
<html lang="en" data-domain="placement">
<head>
  <script>
    (function(){try{var s=localStorage.getItem('pa_theme_preference')||sessionStorage.getItem('pa_theme_preference');if(!s){var m=document.cookie.match(/(?:^|; )pa_theme_preference=(dark|light)/);if(m)s=m[1];}if(!s&&window.name&&window.name.indexOf('pa_theme:')!==-1){var p=window.name.split('pa_theme:')[1];if(p)s=p.split(' ')[0];}var t=(s==='dark')?'dark':'light';document.documentElement.setAttribute('data-theme',t);document.documentElement.style.colorScheme=t;}catch(e){}})();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pre-Placement Talks (PPTs) - Placement Season</title>
  <link rel="stylesheet" href="/css/00-tokens.css">
  <link rel="stylesheet" href="/css/01-reset.css">
  <link rel="stylesheet" href="/css/02-typography.css">
  <link rel="stylesheet" href="/css/03-layout.css">
  <link rel="stylesheet" href="/css/04-components.css">
  <link rel="stylesheet" href="/css/05-patterns.css">
  <link rel="stylesheet" href="/css/06-motion.css">
  <link rel="stylesheet" href="/css/07-domains.css">
</head>
<body class="theme-ground">
  <div class="app-shell">
    <div id="sidebar-container"></div>
    <div class="app-main">
      <div id="topbar-container"></div>

      <main class="app-body" id="main-content">
        <!-- Page Header -->
        <header class="page-header d-flex flex-wrap justify-between align-center gap-3 mb-6">
          <div>
            <div class="d-flex align-center gap-2 mb-2">
              <span class="chip chip-accent uppercase tracking-wider">Corporate Sessions</span>
              <span class="text-xs text-muted">Leadership Dialogues</span>
            </div>
            <h1 class="page-title">Pre-Placement Talks (PPTs)</h1>
            <p class="page-subtitle">Understand company culture, engineering hierarchies, compensation models, and question talent acquisition leaders live.</p>
          </div>
          <div id="tpo-talk-actions">
            <!-- Injected for TPO/Company/Director -->
          </div>
        </header>

        <!-- Talks Grid -->
        <div class="bento-grid mb-6" id="talks-grid">
          <div style="grid-column: 1 / -1;" class="text-center py-6 text-muted">
            <div class="spinner-modern mb-3"></div>
            <div>Loading pre-placement talks...</div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Schedule Talk Modal (Native Accessible Dialog) -->
  <dialog id="createTalkModal" class="custom-dialog">
    <div class="dialog-card">
      <form id="create-talk-form">
        <div class="dialog-header d-flex justify-between align-center p-4 border-bottom">
          <h3 class="text-lg fw-semibold text-ink mb-0" id="createTalkModalLabel">Schedule Pre-Placement Session</h3>
          <button type="button" class="btn-icon" id="btn-close-talk-modal" aria-label="Close dialog">
            <svg class="icon icon-sm"><use href="/icons/sprite.svg#x"></use></svg>
          </button>
        </div>

        <div class="dialog-body p-5">
          <div class="form-grid g-3">
            <div class="form-col-12">
              <label class="form-label">Associated Drive</label>
              <select name="driveId" id="modal-drive-select" class="form-select">
                <option value="">Campus Wide / General Enterprise</option>
              </select>
            </div>
            <div class="form-col-12">
              <label class="form-label">Talk Title *</label>
              <input type="text" name="title" class="form-control" required placeholder="e.g. Life at Google &amp; Engineering Culture">
            </div>
            <div class="form-col-6">
              <label class="form-label">Speaker Name *</label>
              <input type="text" name="speakerName" class="form-control" required placeholder="e.g. Priya Nair">
            </div>
            <div class="form-col-6">
              <label class="form-label">Speaker Role / Designation</label>
              <input type="text" name="speakerRole" class="form-control" placeholder="e.g. Staff Software Engineer">
            </div>
            <div class="form-col-6">
              <label class="form-label">Scheduled Date &amp; Time *</label>
              <input type="datetime-local" name="scheduledAt" class="form-control" required>
            </div>
            <div class="form-col-6">
              <label class="form-label">Venue / Meeting URL</label>
              <input type="text" name="meetingUrl" class="form-control" placeholder="Main Seminar Hall / Zoom Link">
            </div>
            <div class="form-col-12">
              <label class="form-label">Session Overview &amp; Agenda</label>
              <textarea name="description" class="form-control" rows="2" placeholder="Overview of company presentation and interactive Q&A..."></textarea>
            </div>
          </div>
        </div>

        <div class="dialog-footer p-4 border-top d-flex justify-end gap-2 surface-ground">
          <button type="button" class="btn btn-secondary btn-sm" id="btn-cancel-talk-modal">Cancel</button>
          <button type="submit" class="btn btn-primary btn-sm">Schedule Session</button>
        </div>
      </form>
    </div>
  </dialog>

  <script type="module">
    import auth from '/js/auth.js';
    import ui from '/js/ui.js';
    import api from '/js/api.js';

    if (!auth.requireAuth(['ADMIN', 'TPO', 'DIRECTOR', 'STUDENT', 'STAFF', 'COMPANY'])) {}

    const user = auth.getUser();
    ui.initLayout('talks');

    const isTpoOrDirector = user?.role === 'TPO' || user?.role === 'DIRECTOR' || user?.role === 'ADMIN' || user?.role === 'COMPANY';

    if (isTpoOrDirector) {
      document.getElementById('tpo-talk-actions').innerHTML = `
        <button type="button" class="btn btn-primary" id="btn-open-create-talk">
          <svg class="icon icon-sm"><use href="/icons/sprite.svg#calendar-blank"></use></svg>
          Schedule Talk
        </button>
      `;

      document.getElementById('btn-open-create-talk')?.addEventListener('click', () => {
        const dialog = document.getElementById('createTalkModal');
        if (dialog.showModal) dialog.showModal();
        else dialog.setAttribute('open', 'true');
      });

      loadDrivesForModal();
    }

    async function loadDrivesForModal() {
      try {
        const res = await api.get('/drives/all');
        const drives = Array.isArray(res) ? res : (res?.data || []);
        const select = document.getElementById('modal-drive-select');
        select.innerHTML = '<option value="">Campus Wide / General Enterprise</option>' + drives.map(d => `
          <option value="${d.id}">${ui.escapeHtml(d.company?.name || d.companyName)} &mdash; ${ui.escapeHtml(d.title)}</option>
        `).join('');
      } catch (e) {}
    }

    async function loadTalks() {
      try {
        const res = await api.get('/talks');
        const talks = Array.isArray(res) ? res : (res?.data || []);
        renderTalks(talks);
      } catch {
        document.getElementById('talks-grid').innerHTML = `
          <div style="grid-column: 1 / -1;" class="text-center py-6 text-danger">
            ${ui.renderError('Failed to load pre-placement talks.')}
          </div>
        `;
      }
    }

    function renderTalks(talks) {
      const grid = document.getElementById('talks-grid');
      if (talks.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1 / -1;">
            ${ui.renderEmpty('No Pre-Placement Talks Scheduled', 'Upcoming corporate presentations will appear here as dates are announced.')}
          </div>
        `;
        return;
      }

      grid.innerHTML = talks.map(talk => {
        const speaker = talk.speakerName || 'Recruitment Leadership';
        const initial = speaker.charAt(0).toUpperCase();
        const scheduledTime = talk.scheduledAt ? new Date(talk.scheduledAt).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) : 'Scheduled Soon';

        return `
          <article class="bezel-outer poster-card">
            <div class="bezel-inner p-5 d-flex flex-column h-100 justify-between">
              <div>
                <div class="d-flex justify-between align-start gap-2 mb-3">
                  <span class="status-chip status-placed text-xs">
                    <span class="status-dot"></span>
                    LIVE PPT
                  </span>
                  <span class="text-xs text-muted tabular-nums">${ui.escapeHtml(scheduledTime)}</span>
                </div>

                <h3 class="poster-title text-base mb-2">
                  <a href="/placement/pages/4-talks/talk-detail.html?id=${talk.id}" class="text-ink text-decoration-none">
                    ${ui.escapeHtml(talk.title || 'Corporate Recruitment Keynote')}
                  </a>
                </h3>

                <p class="text-xs text-ink-2 lh-relaxed mb-4" style="min-height: 38px;">
                  ${ui.escapeHtml(talk.description || 'Gain insider perspective on the technical recruitment process, expectations, and culture.')}
                </p>

                <div class="surface-tone p-3 rounded-3 mb-4 d-flex align-center gap-3">
                  <span class="avatar avatar-md avatar-placement">${initial}</span>
                  <div>
                    <div class="text-xs fw-semibold text-ink">${ui.escapeHtml(speaker)}</div>
                    <span class="text-xs text-muted">${ui.escapeHtml(talk.speakerRole || 'Campus Recruitment Lead')}</span>
                  </div>
                </div>
              </div>

              <div class="pt-3 border-top d-flex justify-between align-center">
                <div class="text-xs text-muted d-flex align-center gap-1 text-truncate" style="max-width: 160px;">
                  <svg class="icon icon-xs"><use href="/icons/sprite.svg#buildings"></use></svg>
                  <span class="text-truncate">${ui.escapeHtml(talk.meetingUrl || 'Seminar Hall')}</span>
                </div>
                <a href="/placement/pages/4-talks/talk-detail.html?id=${talk.id}" class="btn-pill-nested" title="Enter Session">
                  <span>Enter</span>
                  <span class="btn-nested-circle">
                    <svg class="icon icon-xs"><use href="/icons/sprite.svg#arrow-up-right"></use></svg>
                  </span>
                </a>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    const modalEl = document.getElementById('createTalkModal');
    document.getElementById('btn-close-talk-modal')?.addEventListener('click', () => modalEl.close ? modalEl.close() : modalEl.removeAttribute('open'));
    document.getElementById('btn-cancel-talk-modal')?.addEventListener('click', () => modalEl.close ? modalEl.close() : modalEl.removeAttribute('open'));

    document.getElementById('create-talk-form')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const data = {
        driveId: form.driveId.value ? parseInt(form.driveId.value, 10) : null,
        title: form.title.value.trim(),
        speakerName: form.speakerName.value.trim(),
        speakerRole: form.speakerRole.value.trim(),
        scheduledAt: form.scheduledAt.value,
        meetingUrl: form.meetingUrl.value.trim(),
        description: form.description.value.trim()
      };

      try {
        await api.post('/talks', data);
        ui.showToast('Pre-placement talk scheduled successfully!');
        if (modalEl.close) modalEl.close();
        else modalEl.removeAttribute('open');
        form.reset();
        loadTalks();
      } catch (err) {
        ui.showToast(err.message || 'Failed to schedule talk', 'danger');
      }
    });

    loadTalks();
  </script>
</body>
</html>
